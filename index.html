  },
  fromText(text, accountId, body, sh) {
    const tx = BankImport.textToTx(text);
    if (!tx.length) {
      clear(body);
      add(body, UI.empty('No encontré movimientos en el texto. Prueba a descargar el extracto en Excel o CSV, o pega solo las líneas de movimientos.'),
        h('details', null, h('summary', null, 'Ver texto extraído'), h('pre', { class: 'pre' }, text.slice(0, 4000))));
      return;
    }
    this.review(tx, accountId, body, sh);
  },
  review(tx, accountId, body, sh) {
    const st = App.state;
    const existing = new Set(st.movements.filter(m => m.source === 'extracto').map(m => m.dupKey));
    const items = tx.map(t => {
      const cl = BankImport.classify(st, t.concept, t.amount);
      const dk = BankImport.dupKey({ date: t.date, amount: t.amount, concept: t.concept, accountId });
      return { ...t, catId: cl.catId, conf: cl.conf, dup: existing.has(dk), dk, on: !existing.has(dk), changed: false };
    });
    const months = [...new Set(items.map(i => i.date.slice(0, 7)))].sort();
    const excelMonths = months.filter(ym => st.movements.some(m => m.source === 'excel' && m.date.slice(0, 7) === ym));
    let dropExcel = false;
    const bal = items.filter(i => i.balance !== null).sort((a, b) => a.date < b.date ? -1 : 1);
    let saveBal = bal.length > 0;
    const draw = () => {
      clear(body);
      const on = items.filter(i => i.on);
      const ing = U.sum(on.filter(i => i.amount > 0).map(i => i.amount)), gas = -U.sum(on.filter(i => i.amount < 0).map(i => i.amount));
      const toReview = on.filter(i => i.conf === 'baja' || i.conf === 'ninguna').length;
      add(body, 
        h('div', { class: 'kpis3' }, UI.kpi('Movimientos', String(on.length)), UI.kpi('Entradas', U.money(ing, { dec: 0 }), 'inc'), UI.kpi('Salidas', U.money(gas, { dec: 0 }), 'exp')),
        h('div', { class: 'muted sm pad' }, 'Del ' + U.dateLabel(items.map(i => i.date).sort()[0]) + ' al ' + U.dateLabel(items.map(i => i.date).sort().pop()) + (toReview ? ` · ${toReview} quedarán marcados para revisar` : '')),
        items.some(i => i.dup) ? h('div', { class: 'note warn' }, icon('warn', 18), h('span', null, ` ${items.filter(i => i.dup).length} ya estaban importados y se han desmarcado.`)) : null,
        excelMonths.length ? h('div', { class: 'note warn' }, icon('warn', 18), h('div', null,
          h('span', null, ` ${excelMonths.map(m => U.monthLabel(m, true)).join(', ')} ya tiene totales del Excel. Si importas el detalle, se contaría dos veces.`),
          Settings.switchCell('Quitar los totales del Excel de esos meses', dropExcel, v => { dropExcel = v; }))) : null,
        bal.length ? Settings.switchCell(`Guardar saldo final (${U.money(bal[bal.length - 1].balance)}) en Saldos`, saveBal, v => saveBal = v) : null,
        h('div', { class: 'group-t' }, 'Revisa la clasificación'),
        h('div', { class: 'group' }, items.map((it, k) => {
          const c = Engine.cat(it.catId);
          const catBtn = h('button', { class: 'cat-pill', style: { '--cc': c ? c.color : '#888' }, onclick: () => this.pickCat(it, () => draw()) }, (c ? c.icon + ' ' + c.name : 'Elegir'));
          return h('div', { class: 'rv' + (it.on ? '' : ' off') },
            h('label', { class: 'rv-ck' }, h('input', { type: 'checkbox', checked: it.on, onchange: e => { it.on = e.target.checked; draw(); } })),
            h('div', { class: 'rv-m' },
              h('div', { class: 'rv-t' }, h('span', { class: 'ell' }, it.concept), h('b', { class: it.amount >= 0 ? 'pos' : '' }, U.money(it.amount, { plus: true }))),
              h('div', { class: 'rv-s' }, h('span', { class: 'muted sm' }, U.dateLabel(it.date)), catBtn,
                it.conf === 'ninguna' || it.conf === 'baja' ? h('span', { class: 'tag warn' }, 'revisar') : it.conf === 'alta' ? h('span', { class: 'tag ok' }, 'aprendido') : null)));
        })),
        h('button', { class: 'btn primary sticky-b', onclick: async () => {
          const sel = items.filter(i => i.on);
          if (dropExcel) st.movements = st.movements.filter(m => !(m.source === 'excel' && excelMonths.includes(m.date.slice(0, 7))));
          for (const it of sel) {
            const c = Engine.cat(it.catId);
            const sign = c.type === 'ingreso' ? (it.amount > 0 ? 1 : -1) : c.type === 'gasto' ? (it.amount < 0 ? 1 : -1) : 1;
            st.movements.push({ id: U.uid(), date: it.date, amount: Math.abs(it.amount), sign, catId: it.catId, concept: it.concept, accountId, source: 'extracto', dupKey: it.dk, review: !it.changed && (it.conf === 'baja' || it.conf === 'ninguna') || undefined });
            if (it.changed) BankImport.learn(st, it.concept, it.catId);
          }
          if (saveBal && bal.length) {
            const lastB = bal[bal.length - 1];
            st.balances = st.balances.filter(b => !(b.accountId === accountId && b.date === lastB.date));
            st.balances.push({ id: U.uid(), date: lastB.date, accountId, amount: lastB.balance });
          }
          await Store.saveNow(); sh.close(); App.view.movFilter = null; App.render();
          UI.toast(`Importados ${sel.length} movimientos`);
        } }, `Importar ${on.length} movimientos`));
    };
    draw();
  },
  pickCat(it, after) {
    const type = it.amount >= 0 ? 'ingreso' : 'gasto';
    let tab = type;
    const box = h('div');
    const drawP = () => {
      clear(box);
      add(box, UI.seg([['gasto', 'Gastos'], ['ingreso', 'Ingresos'], ['neutro', 'Traspaso']], tab, v => { tab = v; drawP(); }),
        UI.catPicker(tab, it.catId, id => { it.catId = id; it.changed = true; it.conf = 'manual'; s.close(); after(); }));
    };
    drawP();
    const s = UI.sheet('Categoría', h('div', null, h('p', { class: 'muted sm' }, it.concept), box), { tall: true });
  },

  /* --- Copias de seguridad --- */
  async backup() {
    const st = App.state;
    st.meta.lastBackup = new Date().toISOString();
    await Store.saveNow();
    const copy = JSON.parse(JSON.stringify(st));
    copy.settings.lock = { ...copy.settings.lock, credId: null, faceId: false };
    const ok = await UI.shareOrDownload('ContabiliAPP-copia-' + U.today() + '.json', JSON.stringify(copy));
    if (ok) UI.toast('Copia creada. Guárdala en Archivos o iCloud Drive.');
  },
  async restore() {
    const f = await UI.pickFile('.json,application/json'); if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data || !data.categories || !data.movements) throw new Error('No parece una copia de ContabiliAPP');
      if (!await UI.confirm(`Restaurar ${data.movements.length} movimientos y ${data.balances ? data.balances.length : 0} saldos? Se reemplazarán los datos actuales.`, 'Restaurar', true)) return;
      const lock = App.state.settings.lock;
      App.state = Store.migrate(data);
      if (lock.enabled) App.state.settings.lock = lock;   // conserva tu bloqueo actual de este iPhone
      else App.state.settings.lock.enabled = false;
      await Store.saveNow(); App.applyTheme(); App.view = {}; App.go('home'); UI.toast('Copia restaurada');
      document.querySelectorAll('.sheet-back').forEach(e => e.remove()); document.body.classList.remove('noscroll');
    } catch (e) { UI.toast('No se pudo restaurar: ' + e.message, 'err'); }
  },
  exportCSV() {
    const st = App.state;
    const lines = [['Fecha', 'Tipo', 'Categoría', 'Concepto', 'Importe', 'Cuenta', 'Origen'].join(';')];
    for (const m of st.movements.slice().sort((a, b) => a.date < b.date ? -1 : 1)) {
      const c = Engine.cat(m.catId), a = st.accounts.find(x => x.id === m.accountId);
      lines.push([m.date, c ? c.type : '', c ? c.name : '', '"' + (m.concept || '').replace(/"/g, '""') + '"', String(U.round2(Movs.value(m))).replace('.', ','), a ? a.name : '', m.source].join(';'));
    }
    UI.shareOrDownload('ContabiliAPP-movimientos-' + U.today() + '.csv', '﻿' + lines.join('\n'), 'text/csv');
  }
};

/* ===== Saldos diarios de las cuentas ===== */
const Bal = {
  newAccount() {
    return new Promise(res => {
      const st = App.state;
      const name = h('input', { type: 'text', placeholder: 'Ej.: BBVA nómina, ING ahorro…' });
      const init = UI.num('', { placeholder: 'Saldo actual (opcional)' });
      let done = false;
      UI.sheet('Nueva cuenta', h('div', null, UI.field('Nombre', name), UI.field('Saldo de hoy', init)), {
        onClose: () => { if (!done) res(null); },
        actions: close => h('button', { class: 'txt-btn strong', onclick: () => {
          if (!name.value.trim()) return UI.toast('Pon un nombre', 'err');
          const a = { id: 'a_' + U.uid(), name: name.value.trim(), color: PALETTE[(st.accounts.length * 3 + 2) % PALETTE.length] };
          st.accounts.push(a);
          const v = U.parseAmount(init.value); if (isFinite(v)) st.balances.push({ id: U.uid(), date: U.today(), accountId: a.id, amount: v });
          Store.save(); done = true; close(); res(a);
        } }, 'Crear')
      });
      setTimeout(() => name.focus(), 300);
    });
  },
  record(date) {
    const st = App.state;
    if (!st.accounts.length) return this.newAccount().then(() => App.render());
    const d = h('input', { type: 'date', value: date || U.today() });
    const inputs = {};
    const lastOf = id => st.balances.filter(b => b.accountId === id && b.date <= d.value).sort((a, b) => a.date < b.date ? 1 : -1)[0];
    const list = h('div', { class: 'group' });
    const draw = () => {
      clear(list);
      for (const a of st.accounts) {
        const l = lastOf(a.id);
        const same = l && l.date === d.value;
        inputs[a.id] = UI.num(same ? U.round2(l.amount) : '', { placeholder: l ? 'último: ' + U.money(l.amount, { force: true }) : '0,00', class: 'w-num r' });
        list.appendChild(h('label', { class: 'cell' }, h('span', null, h('i', { class: 'dot', style: { background: a.color } }), ' ', a.name), inputs[a.id]));
      }
    };
    d.addEventListener('change', draw); draw();
    UI.sheet('Registrar saldos', h('div', null, UI.field('Fecha', d), h('p', { class: 'muted sm' }, 'Escribe el saldo que ves en cada banco. Deja en blanco las cuentas que no quieras actualizar.'), list,
      h('button', { class: 'btn ghost', onclick: async () => { const a = await this.newAccount(); if (a) draw(); } }, icon('plus', 18), 'Añadir cuenta')), {
      tall: true,
      actions: close => h('button', { class: 'txt-btn strong', onclick: () => {
        let n = 0;
        for (const a of st.accounts) {
          const v = U.parseAmount(inputs[a.id].value); if (!isFinite(v)) continue;
          st.balances = st.balances.filter(b => !(b.accountId === a.id && b.date === d.value));
          st.balances.push({ id: U.uid(), date: d.value, accountId: a.id, amount: v }); n++;
        }
        if (!n) return UI.toast('No has escrito ningún saldo', 'err');
        Store.save(); close(); App.render(); UI.toast('Saldos guardados');
      } }, 'Guardar')
    });
  },
  accountsManager() {
    const st = App.state, body = h('div');
    const draw = () => {
      clear(body);
      body.appendChild(h('button', { class: 'btn', onclick: async () => { await this.newAccount(); draw(); } }, icon('plus', 18), 'Nueva cuenta'));
      body.appendChild(h('div', { class: 'group' }, st.accounts.map(a => h('button', { class: 'cell link', onclick: () => this.account(a, draw) }, h('i', { class: 'dot', style: { background: a.color } }), h('span', { class: 'grow' }, a.name), icon('chevR', 18, 'muted')))));
    };
    draw(); UI.sheet('Cuentas', body, { tall: true, onClose: () => App.render() });
  },
  account(a, after) {
    const st = App.state;
    const name = h('input', { type: 'text', value: a.name });
    const sw = h('div', { class: 'swatches' });
    const drawSw = () => { clear(sw); PALETTE.forEach(col => sw.appendChild(h('button', { class: 'swatch' + (col === a.color ? ' on' : ''), style: { background: col }, onclick: () => { a.color = col; drawSw(); } }))); };
    drawSw();
    const hist = h('div', { class: 'group' });
    const drawH = () => {
      clear(hist);
      st.balances.filter(b => b.accountId === a.id).sort((x, y) => x.date < y.date ? 1 : -1).slice(0, 120).forEach(b =>
        hist.appendChild(h('div', { class: 'cell' }, h('span', null, U.dateLabel(b.date)), h('b', null, U.money(b.amount)),
          h('button', { class: 'icon-btn danger', 'aria-label': 'Borrar', onclick: () => { st.balances = st.balances.filter(x => x.id !== b.id); Store.save(); drawH(); } }, icon('trash', 16)))));
    };
    drawH();
    const nMov = st.movements.filter(m => m.accountId === a.id).length;
    const s = UI.sheet(a.name, h('div', null, UI.field('Nombre', name), h('div', { class: 'field-l pad' }, 'Color'), sw,
      h('div', { class: 'group-t' }, 'Historial de saldos'), hist,
      h('button', { class: 'btn danger-o', onclick: async () => {
        if (!await UI.confirm(`¿Eliminar la cuenta y sus saldos? Sus ${nMov} movimientos se conservan sin cuenta.`, 'Eliminar', true)) return;
        st.accounts = st.accounts.filter(x => x.id !== a.id); st.balances = st.balances.filter(b => b.accountId !== a.id);
        st.movements.forEach(m => { if (m.accountId === a.id) m.accountId = null; }); Store.save(); s.close(); after && after();
      } }, icon('trash', 18), 'Eliminar cuenta')), {
      tall: true,
      actions: close => h('button', { class: 'txt-btn strong', onclick: () => { a.name = name.value.trim() || a.name; Store.save(); close(); after && after(); App.render(); } }, 'Guardar')
    });
  }
};

Screens.balances = root => {
  const st = App.state, E = Engine;
  root.appendChild(App.header('Saldos', h('button', { class: 'icon-btn', 'aria-label': 'Registrar saldos', onclick: () => Bal.record() }, icon('plus'))));
  if (!st.accounts.length) {
    root.appendChild(UI.card(null, UI.empty('Añade tus cuentas bancarias y apunta su saldo cuando quieras. Verás la evolución diaria en una gráfica.', h('button', { class: 'btn primary', onclick: async () => { await Bal.newAccount(); App.render(); } }, icon('plus', 18), 'Añadir cuenta'))));
    return;
  }
  const series = E.balanceTotalSeries();
  const range = App.view.balRange || '3M';
  const lb = E.latestBalanceTotal();
  const cutoff = { '1M': 31, '3M': 92, '6M': 183, '1A': 366, 'Todo': 1e5 }[range];
  const since = U.ymd(new Date(Date.now() - cutoff * 86400000));
  const pts = series.filter(p => p.date >= since);
  const firstP = pts[0], lastP = pts[pts.length - 1];
  const chg = firstP && lastP ? lastP.total - firstP.total : 0;
  const head = h('section', { class: 'card' },
    h('div', { class: 'card-title' }, 'Total en cuentas'),
    h('div', { class: 'big' }, lb ? U.money(lb.total) : '—'),
    firstP && pts.length > 1 ? h('div', { class: 'muted sm' }, h('span', { class: chg >= 0 ? 'pos' : 'neg' }, U.money(chg, { plus: true })), ' desde ' + U.dateLabel(firstP.date)) : null,
    UI.chips(['1M', '3M', '6M', '1A', 'Todo'].map(x => [x, x]), range, v => { App.view.balRange = v; App.render(); }));
  const chartEl = h('div'); head.appendChild(chartEl);
  const showPer = App.view.balPer !== false;
  head.appendChild(h('label', { class: 'check sm' }, h('input', { type: 'checkbox', checked: showPer, onchange: e => { App.view.balPer = e.target.checked; App.render(); } }), ' Mostrar cada cuenta'));
  root.appendChild(head);
  if (pts.length) {
    const ser = [{ name: 'Total', color: 'var(--accent)', values: pts.map(p => p.total), area: true, width: 2.6, dots: pts.length < 40 }];
    if (showPer && st.accounts.length > 1) for (const a of st.accounts) ser.push({ name: a.name, color: a.color, values: pts.map(p => p.per[a.id] ?? null), width: 1.6 });
    Charts.line(chartEl, { labels: pts.map(p => p.date), series: ser, xFmt: l => U.dateLabel(l).replace(/ \d{4}$/, ''), tipTitle: l => U.dateLabel(l), zero: false, height: 230 });
  } else chartEl.appendChild(UI.empty('Sin registros en este periodo'));

  // Cuentas
  root.appendChild(UI.card('Cuentas', st.accounts.map(a => {
    const bs = E.balanceSeries(a.id); const l = bs[bs.length - 1];
    return h('div', { class: 'acc', onclick: () => Bal.account(a, () => App.render()) },
      h('i', { class: 'dot lg', style: { background: a.color } }),
      h('div', { class: 'grow' }, h('div', null, a.name), h('div', { class: 'muted sm' }, l ? 'al ' + U.dateLabel(l.date) : 'sin saldos')),
      h('div', { class: 'spark' }, Charts.spark(bs.slice(-30).map(b => b.amount), a.color, 70, 26)),
      h('b', null, l ? U.money(l.amount) : '—'));
  }), h('button', { class: 'link-btn', onclick: async () => { await Bal.newAccount(); App.render(); } }, '+ Añadir cuenta')));

  // Comparativa con la posición calculada
  const ps = E.positionSeries();

    const pos = ps[ps.length - 1].pos, diff = lb.total - pos;
    root.appendChild(UI.card('Real vs. calculado',
      h('div', { class: 'two-kpi' }, UI.kpi('Saldo real', U.money(lb.total, { dec: 0 })), UI.kpi('Posición calculada', U.money(pos, { dec: 0 }))),

  }

  // Últimos registros
  const recent = st.balances.slice().sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 12);

    const a = st.accounts.find(x => x.id === b.accountId);
    return h('div', { class: 'cell plain', onclick: () => Bal.record(b.date) }, h('span', { class: 'muted sm' }, U.dateLabel(b.date)), h('span', { class: 'grow' }, a ? a.name : '?'), h('b', null, U.money(b.amount)));
  })));
  root.appendChild(App.fab(() => Bal.record()));
};

  const opts = { includeExtra: inclExtra };
  const gasCats = () => st.categories.filter(c => c.type === 'gasto' && (inclExtra || !c.extra));

  /* ----- MES ----- */
  if (tab === 'month') {
    let ym = App.view.anaYM || last;
    root.appendChild(UI.monthNav(ym, v => { App.view.anaYM = v; App.render(); }, { min: first }));
    root.appendChild(extraToggle());
    const r = E.month(ym, opts);

    const prevY = E.month(U.addMonths(ym, -12), opts);
    root.appendChild(h('div', { class: 'kpis3' },
      UI.kpi('Ingresos', U.money(r.ing, { dec: 0 }), 'inc', prevY.ing ? 'vs año ant. ' + (r.ing >= prevY.ing ? '+' : '') + U.pct(r.ing / prevY.ing - 1, 0) : null),
      UI.kpi('Gastos', U.money(r.gas, { dec: 0 }), 'exp', prevY.gas ? 'vs año ant. ' + (r.gas >= prevY.gas ? '+' : '') + U.pct(r.gas / prevY.gas - 1, 0) : null),
      UI.kpi('Ahorro', U.money(r.net, { dec: 0 }), r.net >= 0 ? 'inc' : 'exp', r.ing ? U.pct(r.net / r.ing, 0) + ' de ingresos' : null)));

    const out = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'];
    out.push('<sheetPr>' + (this.tab ? `<tabColor rgb="FF${this.tab}"/>` : '') + '<pageSetUpPr fitToPage="1"/></sheetPr>');
    out.push(`<sheetViews><sheetView workbookViewId="0" showGridLines="${this.grid ? 1 : 0}" zoomScale="100"${this.book.sheets[0] === this ? ' tabSelected="1"' : ''}>`);
    if (this.freezeAt) {
      const { row, col } = this.freezeAt, tl = XL.ref(row + 1, col + 1);
      const pane = row && col ? 'bottomRight' : row ? 'bottomLeft' : 'topRight';
      out.push(`<pane${col ? ` xSplit="${col}"` : ''}${row ? ` ySplit="${row}"` : ''} topLeftCell="${tl}" activePane="${pane}" state="frozen"/><selection pane="${pane}" activeCell="${tl}" sqref="${tl}"/>`);
    }
    out.push('</sheetView></sheetViews><sheetFormatPr defaultRowHeight="16"/>');
    const wc = Object.keys(this.widths).map(Number).sort((a, b) => a - b);
    if (wc.length) out.push('<cols>' + wc.map(c => `<col min="${c}" max="${c}" width="${this.widths[c]}" customWidth="1"/>`).join('') + '</cols>');
    out.push('<sheetData>');
    for (const r of Object.keys(this.rows).map(Number).sort((a, b) => a - b)) {
      const cells = this.rows[r];
      out.push(`<row r="${r}"${this.heights[r] ? ` ht="${this.heights[r]}" customHeight="1"` : ''}>`);
      for (const c of Object.keys(cells).map(Number).sort((a, b) => a - b)) {
        const { v, s, f } = cells[c], ref = XL.ref(r, c), sa = s ? ` s="${s}"` : '';
        if (f) {
          const isStr = typeof v === 'string';
          out.push(`<c r="${ref}"${sa}${isStr ? ' t="str"' : ''}><f>${XL.esc(f)}</f>${v !== null && v !== undefined && v !== '' ? `<v>${isStr ? XL.esc(v) : (isFinite(v) ? +(+v).toFixed(6) : 0)}</v>` : ''}</c>`);
        } else if (v === null || v === undefined || v === '') out.push(`<c r="${ref}"${sa}/>`);
        else if (typeof v === 'number') out.push(`<c r="${ref}"${sa}><v>${isFinite(v) ? +v.toFixed(6) : 0}</v></c>`);
        else out.push(`<c r="${ref}"${sa} t="inlineStr"><is><t xml:space="preserve">${XL.esc(v)}</t></is></c>`);
      }
      out.push('</row>');
    }
    out.push('</sheetData>');
    if (this.filter) out.push(`<autoFilter ref="${this.filter}"/>`);
    if (this.merges.length) out.push(`<mergeCells count="${this.merges.length}">` + this.merges.map(m => `<mergeCell ref="${m}"/>`).join('') + '</mergeCells>');
    if (this.links.length) out.push('<hyperlinks>' + this.links.map(l => `<hyperlink ref="${l.ref}" location="${XL.esc(l.loc)}" display="${XL.esc(l.display)}"/>`).join('') + '</hyperlinks>');
    out.push('<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>');
    out.push(`<pageSetup paperSize="9" orientation="${this.landscape ? 'landscape' : 'portrait'}" fitToWidth="1" fitToHeight="0"/>`);
    if (this.charts.length) out.push('<drawing r:id="rId1"/>');
    out.push('</worksheet>');
    return out.join('');
  }
}

class XLBook {
  constructor() { this.sheets = []; }
  sheet(name, opts) { const s = new XLSheet(this, name, opts); this.sheets.push(s); return s; }

  /* Gráfico: {type:'combo'|'bar'|'hbar'|'line', title, cats:{r1,r2,c} , series:[{name, col, color, kind, dash}], from:[col,row], to:[col,row], fmt, stacked} */
  chartXml(sh, def) {
    const NS = 'xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
    const sname = XL.q(def.sheet || sh.name);
    const cache = (r1, r2, c, num) => {
      const pts = []; for (let r = r1; r <= r2; r++) { const cl = (sh.rows[r] || {})[c]; const v = cl ? cl.v : null; if (v === null || v === undefined || v === '') continue; pts.push(`<c:pt idx="${r - r1}"><c:v>${XL.esc(num ? (+v || 0).toFixed(2) : v)}</c:v></c:pt>`); }
      return (num ? '<c:formatCode>General</c:formatCode>' : '') + `<c:ptCount val="${r2 - r1 + 1}"/>` + pts.join('');
    };
    const { r1, r2, c: cc } = def.cats;
    const catRef = `<c:cat><c:strRef><c:f>${XL.esc(sname)}!${XL.ref(r1, cc, true)}:${XL.ref(r2, cc, true)}</c:f><c:strCache>${cache(r1, r2, cc, false)}</c:strCache></c:strRef></c:cat>`;
    const sp = (s, line) => line
      ? `<c:spPr><a:ln w="${s.width || 28575}" cap="rnd"><a:solidFill><a:srgbClr val="${s.color}"/></a:solidFill>${s.dash ? '<a:prstDash val="dash"/>' : ''}<a:round/></a:ln></c:spPr>`
      : `<c:spPr><a:solidFill><a:srgbClr val="${s.color}"/></a:solidFill></c:spPr>`;
    const ser = (s, i, line) => {
      const head = s.headRow ? `<c:tx><c:strRef><c:f>${XL.esc(sname)}!${XL.ref(s.headRow, s.col, true)}</c:f><c:strCache><c:ptCount val="1"/><c:pt idx="0"><c:v>${XL.esc(s.name)}</c:v></c:pt></c:strCache></c:strRef></c:tx>` : `<c:tx><c:v>${XL.esc(s.name)}</c:v></c:tx>`;
      return `<c:ser><c:idx val="${i}"/><c:order val="${i}"/>${head}${sp(s, line)}` +
        (line ? `<c:marker><c:symbol val="${s.marker ? 'circle' : 'none'}"/>${s.marker ? `<c:size val="5"/><c:spPr><a:solidFill><a:srgbClr val="${s.color}"/></a:solidFill><a:ln><a:noFill/></a:ln></c:spPr>` : ''}</c:marker>` : '<c:invertIfNegative val="0"/>') +
        catRef + `<c:val><c:numRef><c:f>${XL.esc(sname)}!${XL.ref(r1, s.col, true)}:${XL.ref(r2, s.col, true)}</c:f><c:numCache>${cache(r1, r2, s.col, true)}</c:numCache></c:numRef></c:val>` +
        (line ? '<c:smooth val="0"/>' : '') + '</c:ser>';
    };
    const txPr = sz => `<c:txPr><a:bodyPr/><a:lstStyle/><a:p><a:pPr><a:defRPr sz="${sz}"><a:solidFill><a:srgbClr val="5D6863"/></a:solidFill></a:defRPr></a:pPr><a:endParaRPr lang="es-ES"/></a:p></c:txPr>`;
    const fmt = def.fmt || '#,##0\\ "€"';
    const axes = (hbar) => `<c:catAx><c:axId val="100"/><c:scaling><c:orientation val="${hbar ? 'maxMin' : 'minMax'}"/></c:scaling><c:delete val="0"/><c:axPos val="${hbar ? 'l' : 'b'}"/><c:numFmt formatCode="General" sourceLinked="0"/><c:majorTickMark val="none"/><c:minorTickMark val="none"/><c:tickLblPos val="low"/><c:spPr><a:ln w="9525"><a:solidFill><a:srgbClr val="BFC5C2"/></a:solidFill></a:ln></c:spPr>${txPr(900)}<c:crossAx val="200"/><c:crosses val="autoZero"/><c:auto val="1"/><c:lblAlgn val="ctr"/><c:lblOffset val="100"/>${def.skip ? `<c:tickLblSkip val="${def.skip}"/>` : ''}<c:noMultiLvlLbl val="0"/></c:catAx>` +
      `<c:valAx><c:axId val="200"/><c:scaling><c:orientation val="minMax"/></c:scaling><c:delete val="0"/><c:axPos val="${hbar ? 't' : 'l'}"/><c:majorGridlines><c:spPr><a:ln w="6350"><a:solidFill><a:srgbClr val="E6E2DA"/></a:solidFill></a:ln></c:spPr></c:majorGridlines><c:numFmt formatCode="${XL.esc(fmt)}" sourceLinked="0"/><c:majorTickMark val="none"/><c:minorTickMark val="none"/><c:tickLblPos val="nextTo"/><c:spPr><a:ln><a:noFill/></a:ln></c:spPr>${txPr(900)}<c:crossAx val="100"/><c:crosses val="${hbar ? 'max' : 'autoZero'}"/><c:crossBetween val="between"/></c:valAx>`;
    const bars = def.series.filter(s => s.kind !== 'line'), lines = def.series.filter(s => s.kind === 'line');
    let plot = '';
    if (bars.length) plot += `<c:barChart><c:barDir val="${def.type === 'hbar' ? 'bar' : 'col'}"/><c:grouping val="${def.stacked ? 'stacked' : 'clustered'}"/><c:varyColors val="0"/>${bars.map((s, i) => ser(s, i, false)).join('')}<c:gapWidth val="${def.gap || 70}"/>${def.stacked ? '<c:overlap val="100"/>' : '<c:overlap val="-5"/>'}<c:axId val="100"/><c:axId val="200"/></c:barChart>`;
    if (lines.length) plot += `<c:lineChart><c:grouping val="standard"/><c:varyColors val="0"/>${lines.map((s, i) => ser(s, bars.length + i, true)).join('')}<c:marker val="1"/><c:axId val="100"/><c:axId val="200"/></c:lineChart>`;
    const title = `<c:title><c:tx><c:rich><a:bodyPr/><a:lstStyle/><a:p><a:pPr><a:defRPr sz="1300" b="1"><a:solidFill><a:srgbClr val="1D2421"/></a:solidFill></a:defRPr></a:pPr><a:r><a:rPr lang="es-ES" sz="1300" b="1"><a:solidFill><a:srgbClr val="1D2421"/></a:solidFill></a:rPr><a:t>${XL.esc(def.title)}</a:t></a:r></a:p></c:rich></c:tx><c:overlay val="0"/></c:title>`;
    const legend = def.series.length > 1 ? `<c:legend><c:legendPos val="b"/><c:overlay val="0"/>${txPr(900)}</c:legend>` : '';
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<c:chartSpace ${NS}><c:lang val="es-ES"/><c:roundedCorners val="0"/><c:chart>${title}<c:autoTitleDeleted val="0"/><c:plotArea><c:layout/>${plot}${axes(def.type === 'hbar')}<c:spPr><a:noFill/></c:spPr></c:plotArea>${legend}<c:plotVisOnly val="1"/><c:dispBlanksAs val="gap"/></c:chart><c:spPr><a:solidFill><a:srgbClr val="FFFFFF"/></a:solidFill><a:ln w="9525"><a:solidFill><a:srgbClr val="E6E2DA"/></a:solidFill></a:ln></c:spPr><c:txPr><a:bodyPr/><a:lstStyle/><a:p><a:pPr><a:defRPr><a:latin typeface="Calibri"/></a:defRPr></a:pPr><a:endParaRPr lang="es-ES"/></a:p></c:txPr></c:chartSpace>`;
  }
  drawingXml(sh, firstChart) {
    const anchors = sh.charts.map((d, i) => `<xdr:twoCellAnchor editAs="oneCell"><xdr:from><xdr:col>${d.from[0] - 1}</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${d.from[1] - 1}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:from><xdr:to><xdr:col>${d.to[0] - 1}</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${d.to[1] - 1}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:to><xdr:graphicFrame macro=""><xdr:nvGraphicFramePr><xdr:cNvPr id="${i + 2}" name="Gráfico ${i + 1}"/><xdr:cNvGraphicFramePr/></xdr:nvGraphicFramePr><xdr:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/></xdr:xfrm><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/chart"><c:chart xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:id="rId${i + 1}"/></a:graphicData></a:graphic></xdr:graphicFrame><xdr:clientData/></xdr:twoCellAnchor>`).join('');
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">${anchors}</xdr:wsDr>`;
  }
  build(meta = {}) {
    const files = [], ov = [];
    let chartN = 0, drawN = 0;
    this.sheets.forEach((sh, i) => {
      const idx = i + 1;
      files.push([`xl/worksheets/sheet${idx}.xml`, sh.xml()]);
      ov.push(`<Override PartName="/xl/worksheets/sheet${idx}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`);
      if (sh.charts.length) {
        drawN++;
        files.push([`xl/worksheets/_rels/sheet${idx}.xml.rels`, `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing${drawN}.xml"/></Relationships>`]);
        const rels = [];
        sh.charts.forEach((d, k) => {
          chartN++;
          files.push([`xl/charts/chart${chartN}.xml`, this.chartXml(sh, d)]);
          ov.push(`<Override PartName="/xl/charts/chart${chartN}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawingml.chart+xml"/>`);
          rels.push(`<Relationship Id="rId${k + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/chart" Target="../charts/chart${chartN}.xml"/>`);
        });
        files.push([`xl/drawings/drawing${drawN}.xml`, this.drawingXml(sh)]);
        files.push([`xl/drawings/_rels/drawing${drawN}.xml.rels`, `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels.join('')}</Relationships>`]);
        ov.push(`<Override PartName="/xl/drawings/drawing${drawN}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>`);
      }
    });
    const defNames = this.sheets.filter(s => s.filter).map(s => `<definedName name="_xlnm._FilterDatabase" localSheetId="${this.sheets.indexOf(s)}" hidden="1">${XL.esc(XL.q(s.name))}!${s.filter.replace(/([A-Z]+)(\d+)/g, '$$$1$$$2')}</definedName>`);
    files.push(['xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><workbookPr/><bookViews><workbookView activeTab="0"/></bookViews><sheets>${this.sheets.map((s, i) => `<sheet name="${XL.esc(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets>${defNames.length ? '<definedNames>' + defNames.join('') + '</definedNames>' : ''}<calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>`]);
    files.push(['xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${this.sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${this.sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`]);
    files.push(['xl/styles.xml', XL.styles()]);
    const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
    files.push(['docProps/core.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${XL.esc(meta.title || 'ContabiliAPP')}</dc:title><dc:creator>ContabiliAPP</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified></cp:coreProperties>`]);
    files.push(['docProps/app.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>ContabiliAPP</Application></Properties>`]);
    files.push(['_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/></Relationships>`]);
    files.unshift(['[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>${ov.join('')}</Types>`]);
    return XL.zip(files);
  }
}

/* ===== Exportación a Excel: informe organizado por pestañas con gráficos ===== */
const Exporter = {
  /* Rango completo con datos */
  fullRange() {
    const st = App.state, { first, last } = Engine.realRange();
    const bal = st.balances.map(b => b.date.slice(0, 7)).sort();
    const f = [first, bal[0]].filter(Boolean).sort()[0] || U.curYM();
    const l = last || bal[bal.length - 1] || U.curYM();
    return { from: f, to: l };
  },
  presets() {
    const full = this.fullRange(), cur = U.curYM(), y = new Date().getFullYear();
    const lastReal = Engine.realRange().last || cur;
    return {
      all: { label: 'Todo el historial', ...full },
      ytd: { label: 'Año en curso (' + y + ')', from: y + '-01', to: lastReal < cur ? lastReal : cur },
      last12: { label: 'Últimos 12 meses', from: U.addMonths(lastReal, -11), to: lastReal },
      prevYear: { label: 'Año ' + (y - 1), from: (y - 1) + '-01', to: (y - 1) + '-12' },
      custom: { label: 'Personalizado', from: full.from, to: full.to }
    };
  },
  open() {
    const st = App.state;
    const P = this.presets();
    const o = App.view.exportOpts = App.view.exportOpts || { preset: 'all', from: P.all.from, to: P.all.to, movs: true, bal: true, proj: true, projYears: 5, sims: true };
    const body = h('div');
    const draw = () => {
      clear(body);
      if (o.preset !== 'custom') { o.from = P[o.preset].from; o.to = P[o.preset].to; }
      const nM = U.monthDiff(o.from, o.to) + 1;
      const movs = st.movements.filter(m => m.date.slice(0, 7) >= o.from && m.date.slice(0, 7) <= o.to).length;
      const bals = o.preset === 'all' ? st.balances.length : st.balances.filter(b => b.date.slice(0, 7) >= o.from && b.date.slice(0, 7) <= o.to).length;
      const fromI = h('input', { type: 'month', value: o.from, onchange: e => { if (e.target.value) { o.from = e.target.value; o.preset = 'custom'; draw(); } } });
      const toI = h('input', { type: 'month', value: o.to, onchange: e => { if (e.target.value) { o.to = e.target.value; o.preset = 'custom'; draw(); } } });
      add(body,
        h('p', { class: 'muted sm' }, 'Genera un libro de Excel con una hoja inicial de instrucciones, resumen, gastos e ingresos por categoría, evolución anual, movimientos, saldos y, si quieres, previsión y simulaciones. Todo con formato y gráficos.'),
        h('div', { class: 'group-t' }, 'Periodo'),
        h('div', { class: 'opt-col' }, Object.entries(P).map(([k, p]) => h('button', { class: 'radio-row' + (o.preset === k ? ' on' : ''), onclick: () => { o.preset = k; draw(); } },
          h('i', { class: 'radio' }), h('span', { class: 'grow' }, p.label), k !== 'custom' ? h('small', { class: 'muted' }, U.monthLabel(p.from, true) + ' – ' + U.monthLabel(p.to, true)) : null))),
        h('div', { class: 'two' }, UI.field('Desde', fromI), UI.field('Hasta', toI)),
        o.from > o.to ? h('div', { class: 'note warn' }, icon('warn', 18), h('span', null, ' La fecha de inicio es posterior a la de fin.')) : h('div', { class: 'muted sm pad' }, `${nM} meses · ${movs} movimientos · ${bals} registros de saldo`),
        h('div', { class: 'group-t' }, 'Contenido'),
        h('div', { class: 'group' },
          Settings.switchCell('Lista detallada de movimientos', o.movs, v => o.movs = v),
          Settings.switchCell('Saldos diarios de las cuentas', o.bal, v => o.bal = v),
          Settings.switchCell('Previsión a futuro', o.proj, v => { o.proj = v; draw(); }),
          o.proj ? h('div', { class: 'cell' }, h('span', null, 'Años de previsión'), UI.select([['1', '1 año'], ['3', '3 años'], ['5', '5 años'], ['7', '7 años'], ['10', '10 años']], String(o.projYears), v => o.projYears = +v)) : null,
          Settings.switchCell('Simulaciones (' + st.scenarios.length + ')', o.sims && st.scenarios.length > 0, v => o.sims = v)),
        h('button', { class: 'btn primary', disabled: o.from > o.to, onclick: async e => {
          const btn = e.currentTarget; btn.disabled = true; btn.textContent = 'Generando…';
          try {
            await new Promise(r => setTimeout(r, 30));
            const bytes = this.build(o);
            const name = `ContabiliAPP_${o.from}_a_${o.to}.xlsx`;
            const ok = await UI.shareOrDownload(name, bytes, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
            if (ok) UI.toast('Excel generado');
          } catch (err) { console.error(err); UI.toast('No se pudo generar: ' + err.message, 'err'); }
          btn.disabled = false; btn.textContent = 'Generar Excel';
        } }, icon('download', 20), 'Generar Excel'));
    };
    draw();
    UI.sheet('Exportar a Excel', body, { tall: true });
  },

  /* ---------- Construcción del libro ---------- */
  build(o) {
    const st = App.state, E = Engine, S = XL.S, book = new XLBook();
    const months = []; for (let ym = o.from; ym <= o.to; ym = U.addMonths(ym, 1)) months.push(ym);
    const perLabel = U.monthLabel(o.from) + ' – ' + U.monthLabel(o.to);
    const inRange = d => d.slice(0, 7) >= o.from && d.slice(0, 7) <= o.to;
    const r2 = n => U.round2(n || 0);

      Object.entries(byY).forEach(([y, b], i) => pr.row(Y0 + 1 + i, [y, r2(b.ing), r2(b.gas), r2(b.ing - b.gas), r2(b.pos)], [S.bold, S.money, S.money, S.money, S.moneyTot], 10));
      for (let c = 10; c <= 14; c++) pr.width(c, 14);
      pr.cell(PL + 2, 1, 'Cómo se calcula: cada categoría se estima con su nivel reciente (6 meses en gastos fijos, 12 en el resto), su estacionalidad de los últimos 3 años y la inflación. Las extraordinarias no se proyectan. El rango refleja la variabilidad de tu ahorro mensual. "Mi plan" es la previsión de tu Excel original.', S.muted);
      pr.merge(PL + 2, 1, PL + 2, 8); pr.height(PL + 2, 48);
      plan.push(['Previsión', `Proyección mes a mes a ${yrs} años: ingresos, gastos, ahorro, posición estimada con rango probable${pp ? ' y posición según tu plan del Excel' : ''}, más un resumen por año.`, 'Anticipar cómo evolucionará tu patrimonio si sigues como hasta ahora.']);
    }

    /* ===== Simulaciones ===== */
    if (o.sims && st.scenarios.length) {
      const si = book.sheet('Simulaciones', { tab: 'E0607E' });
      header(si, 'Simulaciones de decisiones', 'Patrimonio a 10 años (liquidez + inversiones − deuda del escenario) frente a la situación base');
      const base = E.simulate(null, 10);
      const sims = st.scenarios.map(s => ({ s, r: E.simulate(s, 10) }));
      const yrRows = []; for (let k = 11; k < base.pts.length; k += 12) yrRows.push(k);
      si.width(1, 14); for (let c = 2; c <= 2 + sims.length; c++) si.width(c, 17);
      si.row(4, ['Fin de', 'Base', ...sims.map(x => x.s.name)], S.head).height(4, 32);
      yrRows.forEach((k, i) => si.row(5 + i, [mLabel(base.pts[k].ym), r2(base.pts[k].baseWorth), ...sims.map(x => r2(x.r.pts[k].worth))], [S.bold, S.money, ...sims.map(() => S.moneyTot)]));
      const SL = 4 + yrRows.length;
      si.chart({ title: 'Patrimonio: base frente a escenarios', cats: { r1: 5, r2: SL, c: 1 }, series: [{ name: 'Base', col: 2, headRow: 4, color: '77827D', kind: 'line', dash: true }, ...sims.map((x, k) => ({ name: x.s.name, col: 3 + k, headRow: 4, color: hex(x.s.color), kind: 'line', marker: true }))], from: [4 + sims.length, 3], to: [14 + sims.length, 21] });
      let r = Math.max(SL + 3, 23);
      for (const { s, r: res2 } of sims) {
        si.cell(r, 1, s.name, S.section); r++;
        s.items.forEach(it => { si.cell(r, 1, '• ' + it.name + ': ' + Sim.itemSummary(it), S.text); si.merge(r, 1, r, 6); r++; });
        res2.notes.forEach(nt => { si.cell(r, 1, nt, S.muted); si.merge(r, 1, r, 6); r++; });
        si.row(r, ['Fin de', 'Base', 'Escenario', 'Diferencia', 'Liquidez', 'Inversiones', 'Deuda'], S.head); r++;
        yrRows.forEach(k => { const p = res2.pts[k]; si.row(r, [mLabel(p.ym), r2(p.baseWorth), r2(p.worth), { v: r2(p.worth - p.baseWorth), f: `C${r}-B${r}` }, r2(p.cash), r2(p.invest), r2(p.debt)], [S.bold, S.money, S.moneyTot, S.money, S.money, S.money, S.money]); r++; });
        if (res2.firstNeg) { si.cell(r, 1, 'Atención: la liquidez sería negativa en ' + U.monthLabel(res2.firstNeg), S.muted); r++; }
        r += 2;
      }
      for (let c = 2; c <= 7; c++) si.width(c, Math.max(si.widths[c] || 0, 15));
      plan.push(['Simulaciones', `Los ${sims.length} escenarios guardados: comparativa de patrimonio año a año, decisiones de cada uno y su desglose (liquidez, inversiones, deuda).`, 'Comparar el efecto a largo plazo de cada decisión financiera.']);
    }

    /* ===== Categorías (configuración) ===== */
    const cf = book.sheet('Categorías', { tab: 'A3ACA8' });
    header(cf, 'Categorías y reglas de clasificación', 'Configuración de la app en el momento de exportar');
    cf.widthsFrom([28, 11, 12, 14, 70]);
    cf.row(4, ['Categoría', 'Tipo', 'Grupo', 'Extraordinaria', 'Palabras clave para clasificar extractos'], S.head);
    cats.forEach((c, i) => cf.row(5 + i, [c.name + (c.archived ? ' (archivada)' : ''), c.type, c.group, c.extra ? 'Sí' : '', (c.keywords || []).join(', ')], [S.bold, S.text, S.text, S.text, S.wrap]));
    const rk = Object.keys(st.rules).sort(); let rr = 7 + cats.length;
    cf.cell(rr, 1, 'Reglas aprendidas (comercio → categoría)', S.section); rr++;
    cf.row(rr, ['Comercio', 'Categoría'], S.head); rr++;
    if (!rk.length) cf.cell(rr, 1, 'Aún no hay reglas aprendidas', S.muted);
    rk.forEach(k => { const c = E.cat(st.rules[k]); cf.row(rr++, [k, c ? c.name : '?'], [S.text, S.text]); });
    cf.freeze(4, 0);
    plan.push(['Categorías', 'Lista de categorías con su tipo, grupo y palabras clave, y las reglas aprendidas al reclasificar.', 'Referencia de cómo se ha clasificado cada movimiento.']);

    /* ===== Inicio: información, estructura e instrucciones ===== */
    ini.widthsFrom([24, 64, 52]);
    ini.cell(1, 1, 'ContabiliAPP · Informe de contabilidad doméstica', S.title).height(1, 34); ini.merge(1, 1, 1, 3);
    ini.cell(2, 1, 'Libro generado automáticamente por la app. Empieza por esta hoja: aquí tienes qué contiene cada pestaña y cómo usarla.', S.subtitle); ini.merge(2, 1, 2, 3);
    const info = [
      ['Periodo exportado', perLabel + ` (${n} ${n === 1 ? 'mes' : 'meses'})`],
      ['Generado el', new Date().toLocaleString('es-ES', { dateStyle: 'long', timeStyle: 'short' })],
      ['Datos reales hasta', E.realRange().last ? U.monthLabel(E.realRange().last) : '—'],
      ['Contenido', `${st.movements.filter(m => inRange(m.date)).length} movimientos · ${st.accounts.length} cuentas · ${cats.length} categorías`],
      ['Resultado del periodo', `Ingresos ${U.money(sumI, { force: true })} · Gastos ${U.money(sumG, { force: true })} · Ahorro ${U.money(sumI - sumG, { force: true })}`]
    ];
    info.forEach(([k, v], i) => { ini.row(4 + i, [k, v], [S.bold, S.text]); ini.merge(4 + i, 2, 4 + i, 3); });
    let r = 4 + info.length + 2;
    ini.cell(r, 1, 'Estructura del documento', S.section); r++;
    ini.row(r, ['Hoja (pulsa para ir)', 'Qué contiene', 'Para qué usarla'], S.headL).height(r, 22); r++;
    plan.unshift(['Inicio', 'Esta hoja: datos del informe, estructura e instrucciones.', 'Punto de partida.']);
    plan.forEach((p, i) => {
      const st2 = i % 2 ? S.band : S.wrap;
      ini.row(r, p, [S.link, st2, st2]); if (p[0] !== 'Inicio') ini.link(r, 1, p[0], p[0]);
      ini.height(r, Math.max(20, 15 * Math.ceil(Math.max(p[1].length / 62, p[2].length / 50)) + 4)); r++;
    });
    r++;
    ini.cell(r, 1, 'Instrucciones básicas', S.section); r++;
    const steps = [
      'Muévete entre hojas con las pestañas de abajo o pulsando los nombres azules de la tabla anterior.',
      'Las cabeceras y las primeras columnas están inmovilizadas: al desplazarte siempre ves a qué mes o categoría corresponde cada dato.',
      'En Movimientos usa las flechas de los títulos para filtrar (por mes, categoría, cuenta, tipo…). El total inferior se recalcula según el filtro.',
      'Los totales, el ahorro, la tasa de ahorro y la posición acumulada son fórmulas: si corriges un importe, se actualizan solos (y los gráficos también).',
      'Signos: en Movimientos los ingresos son positivos y los gastos negativos. En el resto de hojas ingresos y gastos se muestran en positivo.',
      'Extraordinarios (' + cats.filter(c => c.extra).map(c => c.name).join(', ') + '): se incluyen en los totales y se detallan aparte en Resumen para que puedas ver tu gasto corriente.',
      'Los traspasos entre tus propias cuentas no cuentan como ingreso ni gasto.',
      'Posición = posición inicial + ingresos − gastos acumulados (el mismo criterio que tu Excel original). Puede diferir del saldo real de las cuentas (hoja Saldos).',
      'Los meses importados del Excel original aparecen como un movimiento por categoría y mes ("Total mensual (Excel)"); los posteriores, con el detalle de cada extracto.',
      'Para imprimir, cada hoja está ajustada al ancho de una página A4.'
    ];
    steps.forEach((s, i) => { ini.row(r, [String(i + 1), s], [S.int, S.wrap]); ini.merge(r, 2, r, 3); ini.height(r, Math.max(20, 15 * Math.ceil(s.length / 115) + 4)); r++; });
    return book.build({ title: 'ContabiliAPP ' + perLabel });
  }
};

App.init();
</script>
</body>
</html>
