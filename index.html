<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ContabiliAPP</title>
<meta name="description" content="Contabilidad doméstica: ingresos, gastos, saldos, proyecciones y simulaciones">
<meta name="theme-color" content="#f4f2ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ContabiliAPP">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{
  --bg:#f4f2ee; --card:#ffffff; --card-2:#faf9f6; --ink:#1d2421; --ink-2:#5d6863; --ink-3:#8d9792; --line:#e6e2da;
  --accent:#2f7d6d; --accent-2:#e3efeb; --inc:#2e8b57; --exp:#d4553a; --plan:#b7832f; --warn:#c48a12; --danger:#c8402c;
  --shadow:0 1px 2px rgba(30,30,20,.05),0 6px 18px rgba(30,30,20,.05);
  --r:18px; --safe-b:env(safe-area-inset-bottom); --safe-t:env(safe-area-inset-top);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f1412; --card:#19201d; --card-2:#1f2724; --ink:#ece9e3; --ink-2:#a6b0ab; --ink-3:#77827d; --line:#2a3330;
  --accent:#4fbfa6; --accent-2:#1d3530; --inc:#53c486; --exp:#ff7a5c; --plan:#e0ad57; --warn:#e5b14a; --danger:#ff6b55;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-top:var(--safe-t)}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.ico{display:inline-flex;vertical-align:middle}
main{max-width:720px;margin:0 auto;padding:0 16px calc(96px + var(--safe-b))}
.num,.big,.kpi-v,.hero-v,.mov-v,.tbl,.cr-v{font-variant-numeric:tabular-nums}

/* Cabecera */
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:14px 0 10px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 75%,transparent)}
.top h1{font-size:32px;font-weight:750;letter-spacing:-.02em;margin:0}
.top-actions{display:flex;gap:4px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2)}
.icon-btn:active{background:var(--line)}
.icon-btn:disabled{opacity:.3}
.icon-btn.danger{color:var(--danger)}

/* Tarjetas */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:12px 0;display:block;width:100%;text-align:left}
.card-title{font-size:13px;font-weight:650;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.card.list{padding:4px 12px}
.row-card{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.big{font-size:26px;font-weight:720;letter-spacing:-.02em}
.muted{color:var(--ink-3)} .sm{font-size:13px} .center{text-align:center;padding:12px}
.pos{color:var(--inc)} .neg{color:var(--exp)} .neu{color:var(--ink-3)}
.pad{padding:8px 2px} .grow{flex:1;min-width:0} .right{justify-content:flex-end}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inline{display:flex;gap:8px;align-items:center}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.intro{color:var(--ink-2);margin:4px 2px 8px}

/* Héroe */
.hero{background:linear-gradient(150deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 70%,#0d2a24) 100%);color:#fff}
:root[data-theme="dark"] .hero{background:linear-gradient(150deg,#1f4a41,#14302a)}
.hero-l{font-size:14px;opacity:.85}
.hero-v{font-size:40px;font-weight:780;letter-spacing:-.03em;margin:2px 0}
.hero-v.pos,.hero-v.neg{color:#fff}
.hero-s{font-size:14px;opacity:.85;margin-bottom:14px}
.hero-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .kpi{background:rgba(255,255,255,.13);color:#fff}
.hero .kpi-l,.hero .kpi-s{color:rgba(255,255,255,.8)}
.hero-extra{font-size:13px;opacity:.9;margin-top:10px;display:flex;align-items:center;gap:4px}
.hero-empty{text-align:center;padding:28px 20px}
.hero-empty h2{margin:6px 0 6px;font-size:22px}
.hero-empty p{color:var(--ink-2);margin:0 0 18px}
.he-ic{font-size:44px}

/* KPIs */
.kpi{background:var(--card-2);border-radius:14px;padding:10px 12px;min-width:0}
.kpi-l{font-size:12px;color:var(--ink-3);font-weight:600}
.kpi-v{font-size:19px;font-weight:720;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-s{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.kpi.inc .kpi-v{color:var(--inc)} .kpi.exp .kpi-v{color:var(--exp)} .kpi.accent .kpi-v{color:var(--accent)} .kpi.plan .kpi-v{color:var(--plan)}
.hero .kpi .kpi-v{color:#fff}
.kpis3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kpis3 .kpi{background:var(--card);box-shadow:var(--shadow)}
.two-kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}

/* Botones */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border-radius:14px;background:var(--card-2);border:1px solid var(--line);font-weight:600;margin:8px 0}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#06221c}
.btn.ghost{background:none;border-color:transparent;color:var(--accent)}
.btn.danger-o{background:none;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.sm{width:auto;padding:8px 12px;font-size:14px;margin:4px 0}
.btn:disabled{opacity:.45}
.btn:active{transform:scale(.985)}
.txt-btn{color:var(--accent);font-size:16px;padding:6px 4px;display:inline-flex;align-items:center;gap:2px}
.txt-btn.strong{font-weight:700}
.link-btn{color:var(--accent);font-weight:600;padding:10px 0 2px;display:block}
.fab{position:fixed;right:max(18px,calc(50% - 342px));bottom:calc(84px + var(--safe-b));width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent);display:flex;align-items:center;justify-content:center;z-index:20}
:root[data-theme="dark"] .fab{color:#06221c}
.fab:active{transform:scale(.94)}

/* Segmentos y chips */
.seg{display:flex;background:var(--line);border-radius:11px;padding:2px;gap:2px}
.seg button{flex:1;padding:7px 10px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.wide{margin:6px 0 10px}
.seg.big button{padding:10px;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip.on{color:#06221c}
.month-nav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:4px;margin:4px 0 8px}
.month-label{font-weight:680;font-size:17px}

/* Listas de movimientos */
.mov{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.mov:last-child{border-bottom:0}
.mov.review .mov-s{color:var(--warn)}
.mov-m{flex:1;min-width:0}
.mov-c{font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov-s{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov-v{font-weight:680;white-space:nowrap}
.cat-badge{display:inline-flex;align-items:center;justify-content:center;border-radius:11px;flex:none}
.day-h{font-size:13px;font-weight:650;color:var(--ink-3);margin:14px 4px -6px;text-transform:uppercase;letter-spacing:.03em}
.sum-strip{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);padding:4px 4px;font-weight:600}
.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.filter-row{display:flex;gap:8px;align-items:center}
.filter-row .seg{flex:1}
.filter-row select{width:auto;max-width:48%;padding:9px 30px 9px 10px;font-size:14px}
.search-wrap{position:relative;flex:1;display:flex;align-items:center}
.search-wrap .ico{position:absolute;left:10px;color:var(--ink-3)}
.search{padding-left:34px!important;padding-top:9px;padding-bottom:9px}
.banner{display:flex;align-items:center;gap:6px;width:100%;padding:11px 14px;border-radius:14px;margin:6px 0;font-weight:600;font-size:14px;text-align:left}
.banner.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.banner.err{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}

/* Categorías en inicio */
.donut-row{display:flex;gap:14px;align-items:center}
.donut-wrap{flex:none}
.donut-v{font-size:17px;font-weight:750;fill:var(--ink)}
.donut-l{font-size:11px;fill:var(--ink-3)}
.cat-list{flex:1;min-width:0}
.cat-row{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:14px;cursor:pointer}
.cr-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-v{font-weight:650;text-align:right;white-space:nowrap}
.cr-v small{display:block;font-size:11px;font-weight:600;color:var(--ink-3)}
.cr-v small.up{color:var(--exp)} .cr-v small.down{color:var(--inc)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.lg{width:14px;height:14px}
@media (max-width:380px){.donut-row{flex-direction:column}}

/* Barras horizontales */
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink-3);margin:-2px 0 8px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.bar-sw{width:14px;height:8px;border-radius:3px;background:var(--accent);display:inline-block}
.tick-sw{width:2px;height:12px;background:var(--ink);display:inline-block}
.tick-sw.plan{background:var(--plan)}
.hbar{padding:7px 0;cursor:pointer}
.hbar-l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.hbar-t{position:relative;height:9px;background:var(--line);border-radius:5px}
.hbar-f{height:100%;border-radius:5px;min-width:2px}
.hbar-avg{position:absolute;top:-3px;width:2px;height:15px;background:var(--ink);border-radius:1px}
.hbar-avg.plan{background:var(--plan)}
.hbar-s{font-size:12px;color:var(--ink-3);margin-top:3px}

/* Tablas */
.tbl{font-size:14px}
.tr{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.tr:has(> :nth-child(5)){grid-template-columns:.8fr 1fr 1fr 1fr 1fr}
.tr > :not(:first-child){text-align:right}
.tr.th{font-size:12px;color:var(--ink-3);font-weight:650;text-transform:uppercase;letter-spacing:.03em}
.tr:last-child{border-bottom:0}
.plan-t{color:var(--plan);font-weight:600}

/* Gráficas */
.chart{position:relative;width:100%;margin:6px 0 2px;touch-action:pan-y}
.chart-svg{display:block;overflow:visible}
.grid{stroke:var(--line);stroke-width:1}
.grid.zero{stroke:var(--ink-3);stroke-width:1}
.axis{font-size:10.5px;fill:var(--ink-3);font-variant-numeric:tabular-nums}
.rule{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.marker{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 3}
.marker-t{fill:var(--ink-2);font-weight:600}
.chart-tip{position:absolute;top:4px;display:none;background:var(--card);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.14);border-radius:12px;padding:8px 10px;font-size:12.5px;pointer-events:none;z-index:3;min-width:150px;max-width:230px}
.tip-title{font-weight:700;margin-bottom:4px}
.tip-row{display:flex;align-items:center;gap:6px;padding:1px 0}
.tip-row i{width:8px;height:8px;border-radius:2px;flex:none}
.tip-row span{flex:1;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip-row b{font-variant-numeric:tabular-nums;white-space:nowrap}
.spark{flex:none;display:flex;align-items:center}

/* Cuentas */
.acc{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.acc:last-of-type{border-bottom:0}
.cell.plain{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.cell.plain:last-child{border-bottom:0}

/* Hojas modales */
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:50;display:flex;align-items:flex-end;justify-content:center;transition:background .25s}
.sheet-back.show{background:rgba(0,0,0,.35)}
.sheet{background:var(--bg);width:100%;max-width:720px;border-radius:20px 20px 0 0;max-height:92vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1);padding-bottom:var(--safe-b)}
.sheet.tall{height:92vh}
.sheet-back.show .sheet{transform:none}
.sheet-grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:7px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 14px 8px;gap:8px}
.sheet-title{font-weight:700;font-size:17px;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-spacer{width:56px}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 28px;flex:1}
.alert-back{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;display:flex;align-items:center;justify-content:center;padding:30px}
.alert{background:var(--card);border-radius:16px;max-width:320px;width:100%;overflow:hidden;text-align:center}
.alert-msg{padding:20px 18px;font-size:15px}
.alert-btns{display:flex;border-top:1px solid var(--line)}
.alert-btns button{flex:1;padding:13px;color:var(--accent);font-weight:500}
.alert-btns button+button{border-left:1px solid var(--line)}
.alert-btns .strong{font-weight:700} .alert-btns .danger{color:var(--danger);font-weight:700}

/* Formularios */
.field{display:block;margin:10px 0}
.field-l{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:0 2px 5px}
.field-h{display:block;font-size:12px;color:var(--ink-3);margin:4px 2px 0}
.amount-wrap{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:14px 0 4px}
.amount-in{font-size:42px!important;font-weight:750;text-align:center;border:0!important;background:none!important;width:70%!important;letter-spacing:-.02em;padding:4px!important}
.amount-wrap span{font-size:28px;color:var(--ink-3);font-weight:600}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-2);margin:10px 2px}
.check.right{justify-content:flex-end;margin:4px 2px}
.w-num{width:120px!important;text-align:right}
.w-num.r{text-align:right}
.w-emoji{text-align:center;font-size:22px!important}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:4px 0 12px}
.cat-cell{background:var(--card);border:2px solid transparent;border-radius:14px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:74px;box-shadow:var(--shadow)}
.cat-cell.on{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,var(--card))}
.cat-ic{font-size:24px}
.cat-nm{font-size:12px;text-align:center;line-height:1.15;color:var(--ink-2)}
.cat-pill{border:1px solid color-mix(in srgb,var(--cc) 55%,transparent);background:color-mix(in srgb,var(--cc) 12%,transparent);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.swatch.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--bg)}
textarea{resize:vertical}

/* Grupos tipo iOS */
.group-t{font-size:13px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin:20px 6px 6px}
.group-f{font-size:12.5px;color:var(--ink-3);margin:6px 8px 0}
.group{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.group .cell{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;min-height:48px}
.group .cell:last-child{border-bottom:0}
.group .cell.col{flex-direction:column;align-items:stretch}
.group .cell select{width:auto;max-width:60%;padding:7px 30px 7px 10px;font-size:15px}
.group .cell.link{justify-content:flex-start;color:var(--ink)}
.group .cell.link .ico{color:var(--accent)}
.group .cell.danger{color:var(--danger)} .group .cell.danger .ico{color:var(--danger)}
.group .cell.dim{opacity:.55}
.tag{font-size:10.5px;font-weight:700;background:var(--line);color:var(--ink-2);border-radius:6px;padding:1px 6px;margin-left:6px;text-transform:uppercase}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.ok{background:var(--accent-2);color:var(--accent)}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;z-index:1}
.switch i{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s}
.switch i::after{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;background:#fff;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.switch input:checked+i{background:var(--inc)}
.switch input:checked+i::after{transform:translateX(20px)}
.version{text-align:center;color:var(--ink-3);font-size:12px;margin:26px 0 8px}
.note{display:flex;gap:6px;align-items:flex-start;background:var(--accent-2);color:var(--ink-2);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.note .ico{color:var(--accent);margin-top:1px}
.note.warn{background:color-mix(in srgb,var(--warn) 14%,transparent)}
.note.warn .ico{color:var(--warn)}
.big-opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:14px;padding:14px;margin:8px 0;box-shadow:var(--shadow)}
.big-opt .ico{color:var(--accent)}
.big-opt b{display:block}
.big-opt small{display:block;color:var(--ink-3);font-size:13px}
.big-ic{font-size:26px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--card-2);border-radius:12px;flex:none}
.big-ic.sm{font-size:20px;width:34px;height:34px}
.map-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 8px}
.map-grid .field{margin:6px 0}
.map-grid select{padding:9px 24px 9px 8px;font-size:14px}
.rv{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:flex-start}
.rv.off{opacity:.45}
.rv-ck{padding-top:2px}
.rv-m{flex:1;min-width:0}
.rv-t{display:flex;gap:8px;justify-content:space-between;font-size:14px}
.rv-t b{white-space:nowrap}
.rv-s{display:flex;gap:8px;align-items:center;margin-top:5px;flex-wrap:wrap}
.sticky-b{position:sticky;bottom:6px;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.pre{white-space:pre-wrap;font-size:11px;background:var(--card-2);padding:8px;border-radius:8px;max-height:300px;overflow:auto}
.empty{text-align:center;color:var(--ink-3);padding:18px 8px}
.empty-t{margin-bottom:10px}
.help-sec h3{font-size:16px;margin:16px 0 4px}
.help-sec p{margin:4px 0;color:var(--ink-2)}
.notes{margin:0;padding-left:18px;color:var(--ink-2);font-size:14px}
.notes li{margin:4px 0}
details summary{cursor:pointer;color:var(--accent);font-weight:600;padding:8px 0}
.cat-ov .group{margin-top:6px}

/* Escenarios */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cards .card{margin:0}
.scn{border-left:5px solid var(--sc)}
.scn-n{font-weight:700}
.scn-d{font-size:20px;font-weight:750;margin-top:8px}
.scn-head{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.scn-title{font-size:20px!important;font-weight:700;background:none!important;border-color:transparent!important;padding:6px!important}

/* Barra de pestañas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabbar-in{display:flex;width:100%;max-width:720px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:10.5px;font-weight:600;color:var(--ink-3)}
.tabbar button.on{color:var(--accent)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:100;transition:.25s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--danger);color:#fff}

/* Bloqueo */
.lock{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(30px + var(--safe-t)) 24px calc(30px + var(--safe-b));transition:opacity .25s}
.lock.out{opacity:0}
.lock-logo img{width:76px;height:76px;border-radius:18px;box-shadow:var(--shadow)}
.lock-title{font-size:22px;font-weight:750;margin:10px 0 4px}
.lock-msg{color:var(--ink-2);font-size:14px;min-height:20px;text-align:center}
.lock-face{max-width:300px;margin-top:18px}
.lock-or{color:var(--ink-3);font-size:13px;margin:12px 0 6px}
.pin-dots{display:flex;gap:14px;margin:6px 0 18px}
.pin-dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink-3)}
.pin-dots i.on{background:var(--ink);border-color:var(--ink)}
.pin-dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,74px);gap:14px 22px}
.pin-k{width:74px;height:74px;border-radius:50%;background:var(--card);font-size:28px;font-weight:500;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.pin-k.ghost{background:none;box-shadow:none;color:var(--ink-2)}
.pin-k:active{background:var(--line)}
body.is-locked main,body.is-locked .tabbar,body.is-locked .fab{visibility:hidden}
body.privacy main{filter:blur(18px)}
.kpis3 .kpi-v{font-size:16.5px}
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;flex:none}
.card > .cell.link{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.card > .cell.link:last-of-type{border-bottom:0}
.opt-col{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.radio-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
.radio-row:last-child{border-bottom:0}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink-3);flex:none;position:relative}
.radio-row.on .radio{border-color:var(--accent)}
.radio-row.on .radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.two > *{min-width:0}
.two input{min-width:0}
</style>

</div></nav>
<script>/* ===== Utilidades generales ===== */
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MESES_C = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

const U = {
  uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); },
  round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; },

  /* Formato de moneda: 1.234,56 € (agrupando siempre, también 4 cifras) */
  money(n, opts = {}) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    if (App.state && App.state.settings.hideAmounts && !opts.force) return '••••';
    const dec = opts.dec !== undefined ? opts.dec : (Math.abs(n) >= 10000 ? 0 : 2);
    const neg = n < 0;
    let s = Math.abs(n).toFixed(dec);
    let [ent, fr] = s.split('.');
    ent = ent.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    let out = ent + (fr ? ',' + fr : '');
    const sign = neg ? '−' : (opts.plus && n > 0 ? '+' : '');
    return sign + out + (opts.noSymbol ? '' : ' €');
  },
  /* Formato compacto para ejes: 12,5k  1,2M */
  compact(n) {
    if (App.state && App.state.settings.hideAmounts) return '•';
    const a = Math.abs(n), s = n < 0 ? '−' : '';
    if (a >= 1e6) return s + (a / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace('.', ',') + 'M';
    if (a >= 1e3) return s + (a / 1e3).toFixed(a >= 1e4 ? 0 : 1).replace('.', ',') + 'k';
    return s + Math.round(a);
  },
  pct(n, dec = 1) {
    if (n === null || n === undefined || !isFinite(n)) return '—';
    return (n * 100).toFixed(dec).replace('.', ',') + ' %';
  },
  /* Interpreta importes en formato español o inglés: "1.234,56", "-12,30 €", "12.30", "(45,00)" */
  parseAmount(v) {
    if (v === null || v === undefined) return NaN;
    if (typeof v === 'number') return v;
    let s = String(v).trim();
    if (!s) return NaN;
    let neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    s = s.replace(/[€$\s ]|EUR/gi, '');
    if (/^[−–-]/.test(s)) { neg = !neg; s = s.slice(1); }
    if (/-$/.test(s)) { neg = !neg; s = s.slice(0, -1); }
    if (/^\+/.test(s)) s = s.slice(1);
    const lastC = s.lastIndexOf(','), lastD = s.lastIndexOf('.');
    if (lastC > -1 && lastD > -1) {
      if (lastC > lastD) s = s.replace(/\./g, '').replace(',', '.');
      else s = s.replace(/,/g, '');
    } else if (lastC > -1) {
      s = (s.match(/,/g) || []).length > 1 ? s.replace(/,/g, '') : s.replace(',', '.');
    } else if (lastD > -1) {
      const parts = s.split('.');
      if (parts.length > 2 || (parts[1] && parts[1].length === 3 && parts[0].length <= 3 && parts[0] !== '0')) s = s.replace(/\./g, '');
    }
    if (!/^\d*\.?\d+$/.test(s)) return NaN;
    const n = parseFloat(s);
    return neg ? -n : n;
  },
  /* Fechas en formato YYYY-MM-DD */
  ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); },
  today() { return U.ymd(new Date()); },
  ym(y, m) { return y + '-' + String(m).padStart(2, '0'); },
  ymOf(dateStr) { return dateStr.slice(0, 7); },
  ymParts(ym) { const [y, m] = ym.split('-').map(Number); return { y, m }; },
  addMonths(ym, k) { let { y, m } = U.ymParts(ym); let t = y * 12 + (m - 1) + k; return U.ym(Math.floor(t / 12), (t % 12) + 1); },
  monthDiff(a, b) { const A = U.ymParts(a), B = U.ymParts(b); return (B.y - A.y) * 12 + (B.m - A.m); },
  curYM() { const d = new Date(); return U.ym(d.getFullYear(), d.getMonth() + 1); },
  monthLabel(ym, short) { const { y, m } = U.ymParts(ym); return short ? MESES_C[m - 1] + ' ' + String(y).slice(2) : MESES[m - 1] + ' ' + y; },
  dateLabel(ds) {
    const [y, m, d] = ds.split('-').map(Number);
    return d + ' ' + MESES_C[m - 1] + (y !== new Date().getFullYear() ? ' ' + y : '');
  },
  /* Interpreta fechas: dd/mm/yyyy, dd-mm-yy, yyyy-mm-dd, dd.mm.yyyy, número de serie Excel, "12 oct 2026" */
  parseDate(v, refYear) {
    if (v === null || v === undefined || v === '') return null;
    if (v instanceof Date && !isNaN(v)) return U.ymd(v);
    if (typeof v === 'number' || /^\d{5}(\.\d+)?$/.test(String(v).trim())) {
      const n = Number(v);
      if (n > 20000 && n < 80000) { const d = new Date(Math.round((n - 25569) * 86400000)); return U.ymd(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); }
      return null;
    }
    const s = String(v).trim();
    let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
    if (m) return U.validDate(+m[1], +m[2], +m[3]);
    m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
    if (m) { let y = +m[3]; if (y < 100) y += 2000; return U.validDate(y, +m[2], +m[1]); }
    m = s.match(/^(\d{1,2})[-\/.](\d{1,2})$/);
    if (m && refYear) return U.validDate(refYear, +m[2], +m[1]);
    m = s.toLowerCase().match(/^(\d{1,2})[\s-]+([a-zé]{3,})\.?[\s-]+(\d{2,4})/);
    if (m) { const mi = MESES_C.findIndex(x => m[2].startsWith(x)); if (mi >= 0) { let y = +m[3]; if (y < 100) y += 2000; return U.validDate(y, mi + 1, +m[1]); } }
    return null;
  },
  validDate(y, m, d) {
    if (m < 1 || m > 12 || d < 1 || d > 31 || y < 1990 || y > 2100) return null;
    return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  },
  norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim(); },
  /* Clave de comercio: concepto sin números, fechas ni ruido bancario */
  merchantKey(concept) {
    let s = U.norm(concept)
      .replace(/\b(compra|pago|tarj(eta)?|tarj\.|con|en|recibo|adeudo|cargo|transferencia|transf|bizum|a favor de|de|del|la|el|movil|apple pay|google pay|contactless|op\.?|num\.?|ref\.?)\b/g, ' ')
      .replace(/[0-9*#.,:;\/\\\-_()]+/g, ' ')
      .replace(/\s+/g, ' ').trim();
    return s.split(' ').filter(w => w.length > 1).slice(0, 3).join(' ');
  },
  sum(arr) { return arr.reduce((a, b) => a + (b || 0), 0); },
  mean(arr) { return arr.length ? U.sum(arr) / arr.length : 0; },
  std(arr) { if (arr.length < 2) return 0; const m = U.mean(arr); return Math.sqrt(U.sum(arr.map(x => (x - m) ** 2)) / (arr.length - 1)); },
  clamp(x, a, b) { return Math.max(a, Math.min(b, x)); },
  debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; },
  b64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  unb64(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); },
  async sha256(text) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)); return U.b64(b); },
  /* Fusiona importes de cuota de préstamo (sistema francés) */
  loanPayment(principal, tinPct, months) {
    const r = tinPct / 100 / 12;
    if (months <= 0) return 0;
    if (r === 0) return principal / months;
    return principal * r / (1 - Math.pow(1 + r, -months));
  }
};

/* ===== Creación de DOM segura ===== */
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'html') el.innerHTML = v; // solo para SVG/iconos estáticos propios
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (attrs) for (const k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) el.setAttribute(k, attrs[k]);
  return el;
}
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }

/* ===== Iconos (trazos SVG propios) ===== */
const ICON = {

  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',

function icon(name, size = 22, cls = '') {
  const s = h('span', { class: 'ico ' + cls, 'aria-hidden': 'true' });
  s.innerHTML = `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICON[name] || ''}</svg>`;

/* ===== Persistencia en IndexedDB (todo en el dispositivo) ===== */
const DB = {
  _db: null,
  open() {
    return new Promise((res, rej) => {
      if (this._db) return res(this._db);
      const r = indexedDB.open('contabiliapp', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this._db = r.result; res(this._db); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(key) {
    const db = await this.open();
    return new Promise((res, rej) => { const t = db.transaction('kv').objectStore('kv').get(key); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); });
  },
  async set(key, val) {
    const db = await this.open();
    return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(val, key); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
  }
};

const Store = {
  async load() {
    let st = null;
    try { st = await DB.get('state'); } catch (e) { console.warn('IDB no disponible', e); }
    if (!st) { try { const ls = localStorage.getItem('contabiliapp_state'); if (ls) st = JSON.parse(ls); } catch (e) { } }
    st = this.migrate(st || DEFAULT_STATE());
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
    return st;
  },
  migrate(st) {
    const d = DEFAULT_STATE();
    st.settings = Object.assign(d.settings, st.settings || {});
    st.settings.lock = Object.assign(d.settings.lock, st.settings.lock || {});
    st.settings.proj = Object.assign(d.settings.proj, st.settings.proj || {});
    for (const k of ['rules', 'plan']) st[k] = st[k] || {};
    for (const k of ['movements', 'accounts', 'balances', 'scenarios', 'categories']) st[k] = st[k] || [];
    st.meta = Object.assign(d.meta, st.meta || {});
    if (!st.categories.length) st.categories = d.categories;
    if (!st.categories.find(c => c.id === 'traspaso')) st.categories.push(d.categories.find(c => c.id === 'traspaso'));
    return st;
  },
  _save: null,
  save() {
    if (!this._save) this._save = U.debounce(async () => {
      try { await DB.set('state', App.state); }
      catch (e) { try { localStorage.setItem('contabiliapp_state', JSON.stringify(App.state)); } catch (e2) { UI.toast('No se pudo guardar: ' + e2.message, 'err'); } }
    }, 250);
    Engine.invalidate();
    this._save();
  },
  async saveNow() { Engine.invalidate(); await DB.set('state', App.state); }
};

/* ===== Lectores de ficheros sin dependencias: XLSX, XLS (BIFF8), CSV, HTML, PDF y texto ===== */
const Parsers = {
  async inflate(bytes, raw = true) {
    const ds = new DecompressionStream(raw ? 'deflate-raw' : 'deflate');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  },

  /* --- ZIP (para .xlsx) --- */
  async unzip(buf) {
    const dv = new DataView(buf), u8 = new Uint8Array(buf);
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error('No es un fichero ZIP/XLSX válido');
    const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
    const files = {};
    const dec = new TextDecoder();
    for (let i = 0; i < n; i++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
      const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
      const off = dv.getUint32(p + 42, true);
      const name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
      files[name] = { method, csize, off };
      p += 46 + nlen + elen + clen;
    }
    return {
      names: Object.keys(files),
      async text(name) {
        const f = files[name] || files[Object.keys(files).find(k => k.toLowerCase() === name.toLowerCase())];
        if (!f) return null;
        const lh = f.off, nl = dv.getUint16(lh + 26, true), el = dv.getUint16(lh + 28, true);
        const data = u8.subarray(lh + 30 + nl + el, lh + 30 + nl + el + f.csize);
        const out = f.method === 0 ? data : await Parsers.inflate(data, true);
        return new TextDecoder().decode(out);
      }
    };
  },

  /* --- XLSX → [{name, rows:[[...]]}] --- */
  async readXLSX(buf) {
    const z = await this.unzip(buf);
    const xml = s => new DOMParser().parseFromString(s, 'application/xml');
    const wb = xml(await z.text('xl/workbook.xml'));
    const relsTxt = await z.text('xl/_rels/workbook.xml.rels');
    const rels = {};
    if (relsTxt) for (const r of xml(relsTxt).getElementsByTagName('Relationship')) rels[r.getAttribute('Id')] = r.getAttribute('Target');
    const ssTxt = await z.text('xl/sharedStrings.xml');
    const ss = [];
    if (ssTxt) for (const si of xml(ssTxt).getElementsByTagName('si')) {
      let t = ''; for (const x of si.getElementsByTagName('t')) t += x.textContent; ss.push(t);
    }
    const sheets = [];
    for (const s of wb.getElementsByTagName('sheet')) {
      const rid = s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
      let target = rels[rid] || ('worksheets/sheet' + (sheets.length + 1) + '.xml');
      target = target.replace(/^\/?xl\//, '').replace(/^\//, '');
      const txt = await z.text('xl/' + target);
      if (!txt) continue;
      const doc = xml(txt), rows = [];
      for (const c of doc.getElementsByTagName('c')) {
        const ref = c.getAttribute('r'); const m = ref && ref.match(/^([A-Z]+)(\d+)$/);
        if (!m) continue;
        let col = 0; for (const ch of m[1]) col = col * 26 + (ch.charCodeAt(0) - 64); col--;
        const row = +m[2] - 1, t = c.getAttribute('t');
        const vEl = c.getElementsByTagName('v')[0];
        let v = vEl ? vEl.textContent : null;
        if (t === 's' && v !== null) v = ss[+v];
        else if (t === 'inlineStr') { v = ''; for (const x of c.getElementsByTagName('t')) v += x.textContent; }
        else if (t === 'b') v = v === '1';
        else if (t === 'str' || t === 'e') { /* texto */ }
        else if (v !== null && v !== '') v = Number(v);
        if (v === null || v === '') continue;
        (rows[row] = rows[row] || [])[col] = v;
      }
      for (let i = 0; i < rows.length; i++) rows[i] = rows[i] || [];
      sheets.push({ name: s.getAttribute('name'), rows });
    }
    return sheets;
  },

  /* --- XLS antiguo (BIFF8 dentro de OLE2) --- */
  readXLS(buf) {
    const u8 = new Uint8Array(buf), dv = new DataView(buf);
    if (dv.getUint32(0, true) !== 0xE011CFD0) throw new Error('No es un .xls binario');
    const ssz = 1 << dv.getUint16(30, true), mssz = 1 << dv.getUint16(32, true);
    const nFat = dv.getUint32(44, true), dirStart = dv.getUint32(48, true), miniCut = dv.getUint32(56, true);
    const miniFatStart = dv.getUint32(60, true), difStart = dv.getUint32(68, true);
    const sec = i => 512 + i * ssz;
    const fatSecs = [];
    for (let i = 0; i < 109 && fatSecs.length < nFat; i++) fatSecs.push(dv.getUint32(76 + i * 4, true));
    let d = difStart;
    while (fatSecs.length < nFat && d < 0xFFFFFFFA) {
      for (let i = 0; i < ssz / 4 - 1 && fatSecs.length < nFat; i++) fatSecs.push(dv.getUint32(sec(d) + i * 4, true));
      d = dv.getUint32(sec(d) + ssz - 4, true);
    }
    const fat = [];
    for (const s of fatSecs) for (let i = 0; i < ssz / 4; i++) fat.push(dv.getUint32(sec(s) + i * 4, true));
    const chain = (start, f) => { const out = []; let s = start, g = 0; while (s < 0xFFFFFFFA && g++ < 1e6) { out.push(s); s = f[s]; } return out; };
    const readChain = (start, size) => {
      const c = chain(start, fat), out = new Uint8Array(c.length * ssz);
      c.forEach((s, i) => out.set(u8.subarray(sec(s), sec(s) + ssz), i * ssz));
      return size !== undefined ? out.subarray(0, size) : out;
    };
    const dir = readChain(dirStart), ddv = new DataView(dir.buffer, dir.byteOffset, dir.byteLength);
    let root = null, wbEntry = null;
    for (let o = 0; o + 128 <= dir.length; o += 128) {
      const nl = ddv.getUint16(o + 64, true); if (!nl) continue;
      let name = ''; for (let i = 0; i < nl / 2 - 1; i++) name += String.fromCharCode(ddv.getUint16(o + i * 2, true));
      const e = { name, type: dir[o + 66], start: ddv.getUint32(o + 116, true), size: ddv.getUint32(o + 120, true) };
      if (e.type === 5) root = e;
      if (/^(Workbook|Book)$/i.test(name)) wbEntry = e;
    }
    if (!wbEntry) throw new Error('El .xls no contiene un libro');
    let wbb;
    if (wbEntry.size < miniCut && root) {
      const mfat = []; for (const s of chain(miniFatStart, fat)) for (let i = 0; i < ssz / 4; i++) mfat.push(dv.getUint32(sec(s) + i * 4, true));
      const ms = readChain(root.start); const c = chain(wbEntry.start, mfat);
      wbb = new Uint8Array(c.length * mssz); c.forEach((s, i) => wbb.set(ms.subarray(s * mssz, s * mssz + mssz), i * mssz));
      wbb = wbb.subarray(0, wbEntry.size);
    } else wbb = readChain(wbEntry.start, wbEntry.size);
    return [{ name: 'Hoja1', rows: this._biff(wbb) }];
  },
  _biff(b) {
    const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
    const recs = []; let p = 0;
    while (p + 4 <= b.length) { const t = dv.getUint16(p, true), l = dv.getUint16(p + 2, true); recs.push({ t, o: p + 4, l }); p += 4 + l; }
    const rk = v => {
      let n;
      if (v & 2) n = v >> 2;
      else { const t = new DataView(new ArrayBuffer(8)); t.setUint32(4, v & 0xFFFFFFFC, true); t.setUint32(0, 0, true); n = t.getFloat64(0, true); }
      return (v & 1) ? n / 100 : n;
    };
    const str16 = (o, withLen = true) => {
      let cch, q = o;
      if (withLen) { cch = dv.getUint16(q, true); q += 2; }
      const fl = b[q++]; let rt = 0, ext = 0;
      if (fl & 8) { rt = dv.getUint16(q, true); q += 2; }
      if (fl & 4) { ext = dv.getUint32(q, true); q += 4; }
      let s = '';
      if (fl & 1) { for (let i = 0; i < cch; i++) s += String.fromCharCode(dv.getUint16(q + i * 2, true)); q += cch * 2; }
      else { for (let i = 0; i < cch; i++) s += String.fromCharCode(b[q + i]); q += cch; }
      return s;
    };
    // SST con registros CONTINUE
    let sst = [];
    const ri = recs.findIndex(r => r.t === 0x00FC);
    if (ri >= 0) {
      const segs = [recs[ri]]; let k = ri + 1; while (recs[k] && recs[k].t === 0x003C) segs.push(recs[k++]);
      const total = segs.reduce((a, s) => a + s.l, 0), buf = new Uint8Array(total), bounds = new Set();
      let w = 0; for (const s of segs) { buf.set(b.subarray(s.o, s.o + s.l), w); w += s.l; bounds.add(w); }

        let copied = false;
        if (prev && now) {
          const same = varIds.filter(id => now[id] && prev[id] && Math.abs(now[id][m - 1] - prev[id][m - 1]) < 0.005 && now[id][m - 1] !== 0).length;
          const tot = varIds.filter(id => now[id] && now[id][m - 1] !== 0).length;
          copied = tot >= 3 && same >= tot - 1;
        }
        if (copied) return cutoff || U.ym(y, m);
        cutoff = U.ym(y, m);
      }
    }
    return cutoff;
  },
  /* Aplica la importación al estado */
  apply(st, years, cutoffYM, opts = {}) {
    const catByKey = {};
    for (const c of st.categories) catByKey[U.norm(c.name)] = c.id;
    const ensureCat = (name, type, group) => {
      const key = U.norm(name);
      if (/^otros$/.test(key)) return type === 'ingreso' ? 'ing_otros' : 'gas_otros';
      let id = this.aliases[key];
      if (id && st.categories.find(c => c.id === id)) return id;
      if (catByKey[key]) return catByKey[key];
      id = 'c_' + U.uid();
      st.categories.push({ id, name, type, group, icon: type === 'ingreso' ? '💶' : '🏷️', color: PALETTE[st.categories.length % PALETTE.length], keywords: [], extra: false, archived: false });
      catByKey[key] = id; return id;
    };
    if (opts.replace) { st.movements = st.movements.filter(m => m.source !== 'excel'); st.plan = {}; }
    let nReal = 0, nPlan = 0, first = null;
    for (const y of years) {
      for (const l of y.lines) {
        const catId = ensureCat(l.name, l.type, l.group);
        l.vals.forEach((v, idx) => {
          const ym = U.ym(y.year, idx + 1);
          if (!v) return;
          if (cutoffYM && ym <= cutoffYM) {
            const amt = U.round2(v);
            st.movements.push({ id: U.uid(), date: ym + '-01', amount: Math.abs(amt), sign: amt < 0 ? -1 : 1, catId, concept: 'Total mensual (Excel)', accountId: null, source: 'excel' });
            nReal++;
            if (!first || ym < first) first = ym;
          } else {
            (st.plan[ym] = st.plan[ym] || {})[catId] = U.round2((st.plan[ym][catId] || 0) + v);
            nPlan++;
          }
        });
      }
    }
    const y0 = years[0];
    if (y0 && y0.start[1] !== undefined) st.settings.startPosition = { ym: U.ym(y0.year, 1), amount: U.round2(y0.start[1]) };
    st.meta.excelCutoff = cutoffYM;
    return { nReal, nPlan, years: years.map(y => y.year) };
  }
};

/* ===== Extractos bancarios ===== */
const BankImport = {
  HDR: {
    date: /^(f\.?\s*)?(fecha( de)?( la)? ?(operaci[oó]n|operac\.?|oper\.?|mov(imiento)?|contable)?|f\.? ?oper(aci[oó]n)?|date|d[ií]a)$/i,
    vdate: /valor/i,
    concept: /(concepto|descripci[oó]n|detalle|movimiento|operaci[oó]n|observaciones|beneficiario|comercio|texto|description)/i,
    amount: /^(importe|cantidad|amount|importe \(?eur\)?|importe eur|importe €|euros?)$/i,
    debit: /(cargo|debe|gasto|debit|reintegros?|salidas?)/i,
    credit: /(abono|haber|ingreso|credit|entradas?)/i,
    balance: /(saldo|balance|disponible)/i
  },
  /* Busca la fila de cabecera y propone el mapeo de columnas */
  detectColumns(rows) {
    let best = null;
    for (let i = 0; i < Math.min(rows.length, 40); i++) {
      const r = (rows[i] || []).map(x => String(x ?? '').trim());
      const map = { header: i, date: -1, concept: -1, amount: -1, debit: -1, credit: -1, balance: -1, extra: -1 };
      r.forEach((v, c) => {
        const n = U.norm(v);
        if (!n) return;
        if (map.date < 0 && this.HDR.date.test(n) && !this.HDR.vdate.test(n)) map.date = c;
        else if (map.date < 0 && /fecha/.test(n) && !this.HDR.vdate.test(n)) map.date = c;
        else if (map.balance < 0 && this.HDR.balance.test(n)) map.balance = c;
        else if (map.amount < 0 && this.HDR.amount.test(n)) map.amount = c;
        else if (map.debit < 0 && this.HDR.debit.test(n) && !this.HDR.concept.test(n)) map.debit = c;
        else if (map.credit < 0 && this.HDR.credit.test(n) && !this.HDR.concept.test(n)) map.credit = c;
        else if (map.concept < 0 && this.HDR.concept.test(n)) map.concept = c;
        else if (map.concept >= 0 && map.extra < 0 && /(mas datos|más datos|referencia|info|observ)/.test(n)) map.extra = c;
      });
      if (map.date < 0) { const f = r.findIndex(v => /fecha/i.test(v)); if (f >= 0) map.date = f; }
      const score = (map.date >= 0) * 3 + (map.concept >= 0) * 2 + ((map.amount >= 0) || (map.debit >= 0 && map.credit >= 0)) * 3 + (map.balance >= 0);
      if (score >= 6 && (!best || score > best.score)) best = { ...map, score };
    }
    if (best) return best;
    // Sin cabecera: deducir por contenido
    const sample = rows.slice(0, 60).filter(r => r && r.length >= 3);
    const ncol = Math.max(0, ...sample.map(r => r.length));
    const stats = [...Array(ncol)].map((_, c) => {
      const vals = sample.map(r => r[c]);
      return { date: vals.filter(v => U.parseDate(v)).length, num: vals.filter(v => isFinite(U.parseAmount(v))).length, txt: vals.filter(v => typeof v === 'string' && /[a-z]{3,}/i.test(v)).length };
    });
    const map = { header: -1, date: -1, concept: -1, amount: -1, debit: -1, credit: -1, balance: -1, extra: -1 };
    map.date = stats.findIndex(s => s.date > sample.length * 0.5);
    let txtBest = -1; stats.forEach((s, c) => { if (c !== map.date && (txtBest < 0 || s.txt > stats[txtBest].txt)) txtBest = c; }); map.concept = txtBest;
    const nums = stats.map((s, c) => ({ c, n: s.num })).filter(x => x.c !== map.date && x.n > sample.length * 0.5 && stats[x.c].date < sample.length * 0.3);
    if (nums.length) map.amount = nums[0].c;
    if (nums.length > 1) map.balance = nums[nums.length - 1].c;
    return map;
  },
  /* Convierte filas en movimientos según el mapeo */
  rowsToTx(rows, map) {
    const out = [];
    for (let i = map.header + 1; i < rows.length; i++) {
      const r = rows[i] || [];
      const date = U.parseDate(r[map.date]);
      if (!date) continue;
      let amt = NaN;
      if (map.amount >= 0) amt = U.parseAmount(r[map.amount]);
      if (!isFinite(amt) && (map.debit >= 0 || map.credit >= 0)) {
        const d = U.parseAmount(r[map.debit]), c = U.parseAmount(r[map.credit]);
        amt = (isFinite(c) && c ? Math.abs(c) : 0) - (isFinite(d) && d ? Math.abs(d) : 0);
      }
      if (!isFinite(amt) || amt === 0) continue;
      let concept = String(r[map.concept] ?? '').trim();
      if (map.extra >= 0 && r[map.extra]) concept += ' · ' + String(r[map.extra]).trim();
      const bal = map.balance >= 0 ? U.parseAmount(r[map.balance]) : NaN;
      out.push({ date, amount: U.round2(amt), concept: concept || '(sin concepto)', balance: isFinite(bal) ? bal : null });
    }
    return out;
  },
  /* Interpreta texto (PDF o pegado): líneas que empiezan por fecha y terminan en importes */
  textToTx(text) {
    const lines = text.split(/\r?\n/).map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
    const yearM = text.match(/\b(20\d{2})\b/); const refYear = yearM ? +yearM[1] : new Date().getFullYear();
    const amtRe = /[-−+]?\s?\d{1,3}(?:\.\d{3})*,\d{2}\s?-?(?:\s?€|\s?EUR)?|[-−+]?\d+,\d{2}-?/g;
    const dateRe = /^(\d{1,2}[\/.-]\d{1,2}(?:[\/.-]\d{2,4})?)\b\s*(\d{1,2}[\/.-]\d{1,2}(?:[\/.-]\d{2,4})?\b)?/;
    const tx = []; let last = null;
    for (const line of lines) {
      const dm = line.match(dateRe);
      const amts = [...line.matchAll(amtRe)].map(m => m[0]);
      if (dm && amts.length) {
        const date = U.parseDate(dm[1], refYear);
        if (!date) { last = null; continue; }
        let rest = line.slice(dm[0].length);
        const firstAmtIdx = rest.search(amtRe);
        let concept = (firstAmtIdx > 0 ? rest.slice(0, firstAmtIdx) : rest).trim();
        const nums = amts.map(a => { let n = U.parseAmount(a.replace(/\s/g, '')); if (/-$/.test(a.trim())) n = -Math.abs(n); return n; });
        const amount = nums.length >= 2 ? nums[nums.length - 2] : nums[0];
        const balance = nums.length >= 2 ? nums[nums.length - 1] : null;
        last = { date, amount, concept: concept || '(sin concepto)', balance, signKnown: /[-−+]/.test(amts[nums.length >= 2 ? nums.length - 2 : 0]) };
        tx.push(last);
      } else if (last && !amts.length && line.length < 80 && !/saldo|p[aá]gina|total/i.test(line)) {
        last.concept += ' ' + line;
      } else last = null;
    }
    // Orden cronológico (muchos bancos listan del más reciente al más antiguo)
    if (tx.length > 1 && tx[0].date > tx[tx.length - 1].date) tx.reverse();
    // Deducir el signo con la evolución del saldo cuando no viene marcado
    const incomeRe = /(nomina|abono|ingreso|recibid|devoluci|reembolso|intereses a favor|transferencia a su favor|bizum de)/i;
    for (let i = 0; i < tx.length; i++) {
      const t = tx[i];
      if (t.signKnown) continue;
      const prev = tx[i - 1];
      if (t.balance !== null && prev && prev.balance !== null && Math.abs(Math.abs(t.balance - prev.balance) - Math.abs(t.amount)) < 0.02) {
        t.amount = Math.sign(t.balance - prev.balance) * Math.abs(t.amount);
      } else t.amount = (incomeRe.test(t.concept) ? 1 : -1) * Math.abs(t.amount);
    }
    return tx.map(t => ({ date: t.date, amount: U.round2(t.amount), concept: t.concept, balance: t.balance }));
  },

  /* Clasificación: reglas aprendidas > palabras clave de categoría > signo */
  classify(st, concept, amount) {
    const key = U.merchantKey(concept);
    if (key && st.rules[key] && st.categories.find(c => c.id === st.rules[key])) return { catId: st.rules[key], conf: 'alta', by: 'aprendido' };
    const n = ' ' + U.norm(concept) + ' ';
    const wantType = amount >= 0 ? 'ingreso' : 'gasto';
    let best = null;
    for (const c of st.categories) {
      if (c.archived) continue;
      for (const kw of c.keywords || []) {
        const k = U.norm(kw); if (!k) continue;
        const hit = k.endsWith(' ') || k.length <= 3 ? n.includes(' ' + k.trim() + ' ') : n.includes(k);
        if (hit) {
          const typeOk = c.type === wantType || c.type === 'neutro';
          const score = k.length + (typeOk ? 100 : 0);
          if (!best || score > best.score) best = { catId: c.id, score, typeOk };
        }
      }
    }
    if (best && best.typeOk) return { catId: best.catId, conf: 'media', by: 'palabra clave' };
    if (/\bnomina\b|\bsalario\b|\bhaberes\b/.test(n) && amount > 0) return { catId: 'nom_enrique', conf: 'baja', by: 'nómina' };
    if (/\bbizum\b/.test(n)) return { catId: amount > 0 ? 'ing_otros' : 'gas_otros', conf: 'baja', by: 'bizum' };
    return { catId: amount > 0 ? 'ing_otros' : 'gas_otros', conf: 'ninguna', by: '' };
  },
  learn(st, concept, catId) {
    if (!st.settings.learnRules) return;
    const key = U.merchantKey(concept);
    if (key && key.length >= 3) st.rules[key] = catId;
  },
  dupKey(m) { return m.date + '|' + U.round2(m.amount * (m.sign || 1)) + '|' + U.norm(m.concept).slice(0, 40) + '|' + (m.accountId || ''); }
};

/* ===== Motor de cálculo: agregados, posición, proyección y simulaciones ===== */
const Engine = {
  _cache: null,
  invalidate() { this._cache = null; },
  cat(id) { return App.state.categories.find(c => c.id === id); },

  /* Totales por mes y categoría (valor con signo: devoluciones restan) */
  build() {
    if (this._cache) return this._cache;
    const st = App.state, byMonth = {};
    let first = null, last = null;
    for (const m of st.movements) {
      const c = this.cat(m.catId); if (!c || c.type === 'neutro') continue;
      const ym = m.date.slice(0, 7);
      const v = m.amount * (m.sign || 1);
      const bm = byMonth[ym] = byMonth[ym] || {};
      bm[m.catId] = (bm[m.catId] || 0) + v;
      if (!first || ym < first) first = ym;
      if (!last || ym > last) last = ym;
    }
    this._cache = { byMonth, first, last };
    return this._cache;
  },
  realRange() { const b = this.build(); return { first: b.first, last: b.last }; },
  monthCats(ym) { return this.build().byMonth[ym] || {}; },

  /* Resumen de un mes: incluye o no las categorías extraordinarias */
  month(ym, { includeExtra = true, usePlan = false } = {}) {
    let cats = this.monthCats(ym);
    const isPlan = usePlan && !Object.keys(cats).length && App.state.plan[ym];
    if (isPlan) cats = App.state.plan[ym];
    let ing = 0, gas = 0, ingExtra = 0, gasExtra = 0;
    const byCat = {};
    for (const id in cats) {
      const c = this.cat(id); if (!c || c.type === 'neutro') continue;
      const v = cats[id];
      if (c.extra) { if (c.type === 'ingreso') ingExtra += v; else gasExtra += v; if (!includeExtra) continue; }
      byCat[id] = v;
      if (c.type === 'ingreso') ing += v; else gas += v;
    }
    return { ym, ing, gas, net: ing - gas, ingExtra, gasExtra, byCat, isPlan: !!isPlan };
  },
  netAll(ym) { const r = this.month(ym, { includeExtra: true }); return r.net; },

  /* Serie de posición (patrimonio líquido calculado): inicial + acumulado real */
  positionSeries() {
    const st = App.state, sp = st.settings.startPosition;
    const { first, last } = this.realRange();
    if (!first) return [];
    const start = sp && sp.ym && sp.ym < first ? sp.ym : (sp && sp.ym) || first;
    let pos = sp ? sp.amount : 0;
    const out = [];
    const end = last;
    for (let ym = start < first ? start : first; ym <= end; ym = U.addMonths(ym, 1)) {
      if (ym < start) continue;
      pos += this.netAll(ym);
      out.push({ ym, pos });
    }
    return out;
  },

  /* Último saldo real total por cuentas (de "Saldos") */
  latestBalanceTotal() {
    const st = App.state; if (!st.accounts.length || !st.balances.length) return null;
    let total = 0, date = null, n = 0;
    for (const a of st.accounts) {
      const bs = st.balances.filter(b => b.accountId === a.id).sort((x, y) => x.date < y.date ? 1 : -1);
      if (bs[0]) { total += bs[0].amount; n++; if (!date || bs[0].date > date) date = bs[0].date; }
    }
    return n ? { total, date } : null;
  },
  balanceSeries(accountId) {
    return App.state.balances.filter(b => !accountId || b.accountId === accountId).sort((a, b) => a.date < b.date ? -1 : 1);
  },
  /* Serie diaria del total: arrastra el último saldo conocido de cada cuenta */
  balanceTotalSeries() {
    const st = App.state; const dates = [...new Set(st.balances.map(b => b.date))].sort();
    const lastBy = {}; const out = [];
    const byDate = {}; for (const b of st.balances) (byDate[b.date] = byDate[b.date] || []).push(b);
    for (const d of dates) {
      for (const b of byDate[d]) lastBy[b.accountId] = b.amount;
      out.push({ date: d, total: U.sum(Object.values(lastBy)), per: { ...lastBy } });
    }
    return out;
  },

  /* ===== Proyección =====
     Para cada categoría: nivel reciente × estacionalidad del mes × inflación/subida salarial.
     - Fijos: nivel = media de los últimos 6 meses reales
     - Variables e ingresos: nivel = media de los últimos 12 meses reales
     - Estacionalidad: perfil de los últimos 3 años (atenuado si hay pocos datos)
     - Extraordinarias: 0 (salvo que estén en tu plan o fijes un importe)
     Fuente 'plan': usa tu previsión del Excel donde exista y la estimación en el resto. */
  model() {
    const st = App.state, b = this.build();
    const last = b.last; if (!last) return null;
    const months = []; for (let i = 0; i < 36; i++) months.push(U.addMonths(last, -i));
    const model = {};
    for (const c of st.categories) {
      if (c.type === 'neutro' || c.archived) continue;
      const series = months.map(ym => ({ ym, v: (b.byMonth[ym] || {})[c.id] || 0 }));
      const nL = c.group === 'Fijos' ? 6 : 12;
      const level = U.mean(series.slice(0, nL).map(s => s.v));
      // perfil estacional
      const perMonth = {}; const years = new Set();
      for (const s of series) { const { y, m } = U.ymParts(s.ym); (perMonth[m] = perMonth[m] || []).push(s.v); years.add(y); }
      const overall = U.mean(series.map(s => s.v));
      const seas = {};
      const nY = Math.min(3, years.size), w = nY / (nY + 1);
      for (let m = 1; m <= 12; m++) {
        const avg = U.mean(perMonth[m] || []);
        const raw = overall > 0 ? avg / overall : 1;
        seas[m] = c.group === 'Fijos' ? raw : (w * raw + (1 - w) * 1);
      }
      const sNorm = U.mean(Object.values(seas)) || 1;
      for (let m = 1; m <= 12; m++) seas[m] = seas[m] / sNorm;
      model[c.id] = { level, seas, type: c.type, extra: c.extra, group: c.group };
    }
    // Volatilidad del ahorro mensual (para el rango probable)
    const nets = months.slice(0, 24).map(ym => { const r = this.month(ym, { includeExtra: false }); return r.net; });
    model._sigma = U.std(nets);
    model._last = last;
    return model;
  },
  /* Proyecta mes a mes durante n meses. Devuelve [{ym, ing, gas, net, byCat}] */
  project(nMonths, opts = {}) {
    const st = App.state, P = st.settings.proj;
    const model = opts.model || this.model(); if (!model) return [];
    const source = opts.source || P.source;
    const infl = (opts.inflation ?? P.inflation) / 100, sal = (opts.salaryGrowth ?? P.salaryGrowth) / 100;
    const out = [];
    const startYM = U.addMonths(model._last, 1);
    for (let k = 0; k < nMonths; k++) {
      const ym = U.addMonths(startYM, k), { m } = U.ymParts(ym);
      const t = (k + 1) / 12;
      const planM = source === 'plan' ? st.plan[ym] : null;
      const byCat = {}; let ing = 0, gas = 0;
      for (const id in model) {
        if (id[0] === '_') continue;
        const md = model[id], ov = P.overrides[id];
        let v;
        if (ov && ov.mode === 'none') v = 0;
        else if (ov && ov.mode === 'fixed') v = (+ov.amount || 0) * Math.pow(1 + (md.type === 'ingreso' ? sal : infl), t);
        else if (planM) v = planM[id] || 0;   // tu plan es completo para ese mes
        else if (md.extra) v = 0;
        else v = md.level * md.seas[m] * Math.pow(1 + (md.type === 'ingreso' ? sal : infl), t);
        if (!v) continue;
        byCat[id] = v;
        if (md.type === 'ingreso') ing += v; else gas += v;
      }
      // categorías del plan que no estaban en el modelo (nuevas)
      if (planM) for (const id in planM) if (!(id in byCat) && !(id in model)) { const c = this.cat(id); if (!c || c.type === 'neutro') continue; byCat[id] = planM[id]; if (c.type === 'ingreso') ing += planM[id]; else gas += planM[id]; }
      out.push({ ym, ing, gas, net: ing - gas, byCat, fromPlan: !!planM });
    }
    return out;
  },
  /* Punto de partida de la proyección */
  startingPosition() {
    const P = App.state.settings.proj;
    const ps = this.positionSeries();
    const calc = ps.length ? ps[ps.length - 1].pos : (App.state.settings.startPosition.amount || 0);
    if (P.startFrom === 'balances') { const b = this.latestBalanceTotal(); if (b) return { amount: b.total, label: 'saldo real de tus cuentas (' + U.dateLabel(b.date) + ')' }; }
    return { amount: calc, label: 'posición calculada a ' + (ps.length ? U.monthLabel(ps[ps.length - 1].ym) : 'inicio') };
  },
  projectionSeries(years, opts = {}) {
    const model = this.model(); if (!model) return null;
    const flows = this.project(years * 12, { ...opts, model });
    const start = this.startingPosition();
    let pos = start.amount; const sig = model._sigma;
    return {
      start, sigma: sig,
      points: flows.map((f, i) => { pos += f.net; const band = sig * Math.sqrt(i + 1); return { ...f, pos, lo: pos - band, hi: pos + band }; })
    };
  },

  /* ===== Simulación de decisiones ===== */
  simulate(scn, years, opts = {}) {
    const n = years * 12;
    const model = this.model(); if (!model) return null;
    const base = this.project(n, { model, source: opts.source });
    const start = this.startingPosition().amount;
    const cashRet = (App.state.settings.proj.cashReturn || 0) / 100 / 12;
    const items = (scn && scn.items) || [];
    const startYM = base.length ? base[0].ym : U.curYM();
    const idx = ym => U.monthDiff(startYM, ym);
    const delta = new Array(n).fill(0);            // flujo extra de caja
    const invest = new Array(n).fill(0);           // valor de inversiones
    const debt = new Array(n).fill(0);             // deuda pendiente creada en el escenario
    const notes = []; let interestPaid = 0, interestSaved = 0;
    for (const it of items) {
      const s = Math.max(0, idx(it.start || startYM));
      if (it.type === 'puntual') { const i = idx(it.start); if (i >= 0 && i < n) delta[i] += (it.kind === 'ingreso' ? 1 : -1) * (+it.amount || 0); }
      else if (it.type === 'recurrente') {
        const dur = +it.months || n, g = (+it.growth || 0) / 100;
        for (let i = s; i < Math.min(n, s + dur); i++) delta[i] += (it.kind === 'ingreso' ? 1 : -1) * (+it.amount || 0) * Math.pow(1 + g, Math.floor((i - s) / 12));
      }
      else if (it.type === 'categoria') {
        const end = it.end ? idx(it.end) : n; const c = this.cat(it.catId); if (!c) continue;
        for (let i = s; i < Math.min(n, end); i++) {
          const baseV = base[i].byCat[it.catId] || 0;
          const dv = it.mode === 'pct' ? baseV * (+it.value || 0) / 100 : (+it.value || 0);

/* ===== Bloqueo con Face ID (passkey de iOS) y PIN de respaldo ===== */
const Lock = {
  locked: false, hiddenAt: null,
  supported() { return !!(window.PublicKeyCredential && navigator.credentials); },
  async platformAvailable() { try { return this.supported() && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); } catch (e) { return false; } },
  async enableFaceId() {
    const ch = crypto.getRandomValues(new Uint8Array(32));
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: ch, rp: { name: 'ContabiliAPP' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'ContabiliAPP', displayName: 'ContabiliAPP (bloqueo)' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
      timeout: 60000, attestation: 'none'
    } });
    App.state.settings.lock.credId = U.b64(cred.rawId);
    App.state.settings.lock.faceId = true;
    Store.save();
  },
  async verifyFaceId() {
    const L = App.state.settings.lock;
    const a = await navigator.credentials.get({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: L.credId ? [{ type: 'public-key', id: U.unb64(L.credId), transports: ['internal', 'hybrid'] }] : [],
      userVerification: 'required', timeout: 60000
    } });
    if (!a || !a.response || !a.response.authenticatorData) return false;
    const flags = new Uint8Array(a.response.authenticatorData)[32];
    return (flags & 0x04) === 0x04; // UV: verificación biométrica/código realizada
  },
  async setPin(pin) {
    const salt = U.b64(crypto.getRandomValues(new Uint8Array(16)));
    App.state.settings.lock.salt = salt;
    App.state.settings.lock.pinHash = await U.sha256(salt + ':' + pin);
    Store.save();
  },
  async checkPin(pin) { const L = App.state.settings.lock; return L.pinHash && (await U.sha256(L.salt + ':' + pin)) === L.pinHash; },
  show() {
    const L = App.state.settings.lock; if (!L.enabled) return;
    this.locked = true;
    document.body.classList.add('is-locked');
    let scr = document.getElementById('lock'); if (scr) scr.remove();
    let pin = '';
    const dots = h('div', { class: 'pin-dots' });
    const msg = h('div', { class: 'lock-msg' }, L.faceId ? 'Toca para desbloquear con Face ID' : 'Introduce tu PIN');
    const drawDots = () => { clear(dots); for (let i = 0; i < 6; i++) dots.appendChild(h('i', { class: i < pin.length ? 'on' : '' })); };
    const tryPin = async () => {
      if (pin.length < 4) return;
      if (await this.checkPin(pin)) this.unlock();
      else if (pin.length >= 6) { dots.classList.add('shake'); setTimeout(() => dots.classList.remove('shake'), 400); pin = ''; drawDots(); msg.textContent = 'PIN incorrecto'; }
    };
    const pad = h('div', { class: 'pin-pad' });
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'face', '0', 'del'].forEach(k => {
      if (k === 'face') pad.appendChild(L.faceId ? h('button', { class: 'pin-k ghost', 'aria-label': 'Face ID', onclick: () => this.tryFace(msg) }, icon('face', 30)) : h('span'));
      else if (k === 'del') pad.appendChild(h('button', { class: 'pin-k ghost', onclick: () => { pin = pin.slice(0, -1); drawDots(); } }, '⌫'));
      else pad.appendChild(h('button', { class: 'pin-k', onclick: () => { if (pin.length < 6) { pin += k; drawDots(); tryPin(); } } }, k));
    });
    drawDots();
    scr = h('div', { id: 'lock', class: 'lock' },
      h('div', { class: 'lock-logo' }, h('img', { src: 'icon-180.png', alt: '' })),
      h('div', { class: 'lock-title' }, 'ContabiliAPP'), msg,
      L.faceId ? h('button', { class: 'btn primary lock-face', onclick: () => this.tryFace(msg) }, icon('face', 22), 'Desbloquear con Face ID') : null,
      h('div', { class: 'lock-or' }, L.faceId ? 'o con tu PIN' : ''), dots, pad);
    document.body.appendChild(scr);
    if (L.faceId) setTimeout(() => this.tryFace(msg, true), 350);
  },
  async tryFace(msg, auto) {
    try { if (await this.verifyFaceId()) this.unlock(); }
    catch (e) { if (!auto) msg.textContent = e.name === 'NotAllowedError' ? 'Face ID cancelado. Usa tu PIN o vuelve a intentarlo.' : 'Face ID no disponible: usa tu PIN'; }
  },
  unlock() {
    this.locked = false; document.body.classList.remove('is-locked');
    const s = document.getElementById('lock'); if (s) { s.classList.add('out'); setTimeout(() => s.remove(), 250); }
  },
  watch() {
    document.addEventListener('visibilitychange', () => {
      const L = App.state.settings.lock;
      if (document.hidden) { this.hiddenAt = Date.now(); document.body.classList.add('privacy'); }
      else {
        document.body.classList.remove('privacy');
        if (L.enabled && !this.locked && this.hiddenAt && Date.now() - this.hiddenAt >= (L.autoLockMin || 0) * 60000) this.show();
      }
    });
  }
};

/* ===== Flujos de importación y copias de seguridad ===== */
const Importer = {
  /* --- Tu Excel de contabilidad --- */
  async excel() {
    const file = await UI.pickFile('.xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    if (!file) return;
    let sheets;
    try { const r = await Parsers.readAny(file); sheets = r.sheets; } catch (e) { return UI.toast('No pude leer el fichero: ' + e.message, 'err'); }
    const sh0 = sheets && ExcelImport.detect(sheets);
    if (!sh0) return UI.toast('No reconozco el formato. ¿Es tu Excel de contabilidad por años?', 'err');
    const years = ExcelImport.parse(sh0);
    const detected = ExcelImport.detectCutoff(years);
    const st = App.state;
    const opts = [];
    for (const y of years) for (let m = 1; m <= 12; m++) opts.push(U.ym(y.year, m));
    let cutoff = detected || opts[opts.length - 1];
    const hasExcel = st.movements.some(m => m.source === 'excel');
    let replace = true;
    const prev = h('div');
    const drawPrev = () => {
      clear(prev);
      const rows = years.map(y => {
        let ing = 0, gas = 0, real = 0;
        y.lines.forEach(l => l.vals.forEach((v, i) => { const ym = U.ym(y.year, i + 1); if (l.type === 'ingreso') ing += v; else gas += v; if (ym <= cutoff && v) real++; }));
        const allReal = U.ym(y.year, 12) <= cutoff, noneReal = U.ym(y.year, 1) > cutoff;
        return h('div', { class: 'cell' }, h('b', null, y.year), h('span', { class: 'muted sm' }, allReal ? 'real' : noneReal ? 'plan' : 'real + plan'), h('span', { class: 'pos' }, U.money(ing, { dec: 0 })), h('span', { class: 'neg' }, U.money(gas, { dec: 0 })));
      });
      prev.appendChild(h('div', { class: 'group' }, rows));
    };
    drawPrev();
    const body = h('div', null,
      h('p', null, `Encontrados ${years.length} años (${years[0].year}–${years[years.length - 1].year}) con ${new Set(years.flatMap(y => y.lines.map(l => l.name))).size} conceptos.`),
      h('div', { class: 'note' }, icon('sparkle', 18), h('span', null, detected ? ` He detectado datos reales hasta ${U.monthLabel(detected)}: a partir de ahí tu Excel repite cifras del año anterior, así que lo trato como tu plan (previsión).` : ' Elige hasta qué mes son datos reales.')),
      UI.field('Datos reales hasta', UI.select(opts.map(o => [o, U.monthLabel(o)]), cutoff, v => { cutoff = v; drawPrev(); }), 'Lo anterior cuenta como contabilidad real; lo posterior, como tu previsión para comparar y proyectar.'),
      hasExcel ? Settings.switchCell('Sustituir lo importado antes del Excel', true, v => replace = v) : null,
      h('div', { class: 'group-t' }, 'Resumen por año (ingresos · gastos)'), prev);
    UI.sheet('Importar Excel', body, {
      tall: true,
      actions: close => h('button', { class: 'txt-btn strong', onclick: async () => {
        const r = ExcelImport.apply(st, years, cutoff, { replace: hasExcel ? replace : false });
        await Store.saveNow(); close(); App.view = {}; App.go('home');
        UI.toast(`Importados ${r.nReal} totales reales y ${r.nPlan} de previsión`);
      } }, 'Importar')
    });
  },

  /* --- Extracto bancario --- */
  bank() {
    const st = App.state;
    let accountId = (App.view.lastAccount && st.accounts.find(a => a.id === App.view.lastAccount)) ? App.view.lastAccount : (st.accounts[0] || {}).id || '';
    const body = h('div');

        accountId = v; App.view.lastAccount = v;
      });
      return UI.field('Cuenta del extracto', sel);
    };
    const drawStart = () => {
      clear(body);
      add(body, accRow(),

          const f = await UI.pickFile('.xlsx,.xls,.csv,.txt,.pdf,.htm,.html,text/csv,application/pdf'); if (!f) return;
          try {
            const r = await Parsers.readAny(f);
            if (r.kind === 'text') this.fromText(r.text, accountId, body, sh); else this.mapping(r.sheets, accountId, body, sh);
          } catch (e) { console.error(e); UI.toast('No pude leer el fichero: ' + e.message, 'err'); }
        } }, icon('file', 26), h('div', null, h('b', null, 'Elegir fichero del banco'), h('small', null, 'Excel (.xlsx, .xls), CSV o PDF descargado de tu banca online'))),
        h('button', { class: 'big-opt', onclick: () => {

          const ta = h('textarea', { rows: 10, placeholder: 'Pega aquí las líneas del extracto (fecha, concepto, importe, saldo)…' });
          clear(body); add(body, h('p', { class: 'muted' }, 'Copia los movimientos desde la web o app del banco o desde el PDF y pégalos aquí.'), ta,
            h('button', { class: 'btn primary', onclick: () => { if (ta.value.trim()) this.fromText(ta.value, accountId, body, sh); } }, 'Analizar texto'),
            h('button', { class: 'btn ghost', onclick: drawStart }, 'Volver'));
          setTimeout(() => ta.focus(), 200);
        } }, icon('clipboard', 26), h('div', null, h('b', null, 'Pegar texto'), h('small', null, 'Copiado de la app del banco o de un PDF'))),
        h('div', { class: 'note' }, icon('info', 18), h('span', null, ' Consejo: en tu banca online busca “Descargar movimientos” y elige Excel o CSV; es lo más fiable. El PDF también funciona con la mayoría de bancos.')));
    };
    drawStart();
  },
  mapping(sheets, accountId, body, sh) {
    let si = 0, map = BankImport.detectColumns(sheets[0].rows);
    const draw = () => {
      clear(body);
      const rows = sheets[si].rows;
      const width = Math.max(...rows.slice(0, 60).map(r => (r || []).length), 1);
      const hdr = map.header >= 0 ? rows[map.header] || [] : [];

        h('p', { class: 'muted sm' }, 'Comprueba qué columna es cada dato. Si el banco separa cargos y abonos, usa esas dos y deja “Importe” vacío.'),

        h('div', { class: 'group-t' }, 'Vista previa (' + tx.length + ' movimientos detectados)'),
        h('div', { class: 'group' }, tx.slice(0, 5).map(t => h('div', { class: 'cell' }, h('span', { class: 'muted sm' }, U.dateLabel(t.date)), h('span', { class: 'grow ell' }, t.concept), h('b', { class: t.amount >= 0 ? 'pos' : '' }, U.money(t.amount, { plus: true }))))),
        h('button', { class: 'btn primary', disabled: !tx.length, onclick: () => this.review(tx, accountId, body, sh) }, 'Continuar'));
    };
